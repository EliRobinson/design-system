packages:
  - './packages/*'
  - './apps/*'
  # Repo-local CI tooling. Private and never published — it encodes this
  # repository's own paths, which is exactly what must not reach a consumer.
  # It is a workspace package solely so `pnpm test` reaches its tests.
  - './scripts'

# Internal deps are declared with the workspace protocol ("@elirobinson/tokens":
# "workspace:*"), which pins them to the workspace copy no matter what this
# setting says; pnpm rewrites the spec to the real version at pack time, so
# consumers still receive an exact pin. This stays on as the safety net for any
# internal dep not on the protocol: pnpm 10 defaults it to false, which turns a
# plain version spec into a registry lookup — so during a release, right after
# `changeset version` bumps a package, the install resolves a version that has
# not been published yet and 404s. Pin it on so the workspace copy always wins.
linkWorkspacePackages: true

# pnpm 11 replaced `onlyBuiltDependencies` (an allowlist array) with `allowBuilds`
# (a map). Without it these two are reported as ERR_PNPM_IGNORED_BUILDS and their
# native binaries never get linked.
allowBuilds:
  esbuild: true
  nx: true
