packages:
  - './packages/*'
  - './apps/*'

# Internal deps are declared as exact versions ("@elirobinson/tokens": "0.2.0")
# rather than workspace:*, and scripts/sync-workspace-deps.mjs keeps them in step
# with each package's version. pnpm 10 defaults this to false, which turns those
# specs into registry lookups — so during a release, right after `changeset
# version` bumps a package, the install resolves a version that has not been
# published yet and 404s. Pin it on so the workspace copy always wins.
linkWorkspacePackages: true

onlyBuiltDependencies:
  - esbuild
  - nx
