packages:
  - './packages/*'
  - './apps/*'
  # Repo-local CI tooling. Private and never published — it encodes this
  # repository's own paths, which is exactly what must not reach a consumer.
  # It is a workspace package solely so `pnpm test` reaches its tests.
  - './scripts'

# Internal deps are declared with the workspace protocol ("@elirobinson/tokens":
# "workspace:*"), which pins them to the workspace copy no matter what this
# setting says; pnpm rewrites the spec to the real version at pack time, so
# consumers still receive an exact pin. This stays on as the safety net for any
# internal dep not on the protocol: pnpm 10 defaults it to false, which turns a
# plain version spec into a registry lookup — so during a release, right after
# `changeset version` bumps a package, the install resolves a version that has
# not been published yet and 404s. Pin it on so the workspace copy always wins.
linkWorkspacePackages: true

# pnpm 11 replaced `onlyBuiltDependencies` (an allowlist array) with `allowBuilds`
# (a map). Without it these two are reported as ERR_PNPM_IGNORED_BUILDS and their
# native binaries never get linked.
allowBuilds:
  esbuild: true
  nx: true

# This workspace is React 19 everywhere — root declares react 19 and every
# package peers on ^19.0.0. Several packages in the vendored AI Elements tree
# (@rive-app/react-webgl2, ansi-to-react, react-jsx-parser) still declare a
# React 18 peer, and pnpm honours that by resolving a *second* @types/react into
# their subtree. Two copies of the React types in one program are structurally
# incompatible: `ReactNode` from one is not assignable to `ReactNode` from the
# other (React 19 added `bigint`), so every `children` prop crossing the boundary
# fails to typecheck and their default exports stop being valid JSX element
# types. Measured: 18 build errors in packages/ai-elements before this, 0 after.
#
# Forcing the single version the repo actually installs is the fix, not a
# workaround — there is no build here in which React 18 types are correct.
overrides:
  '@types/react': ^19.2.14
  '@types/react-dom': ^19.2.3

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.74'
  - ai@7.0.92
