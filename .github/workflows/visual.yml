name: Visual

on:
  pull_request:
  push:
    branches:
      - main
  # 06:00 UTC daily. The sweep is the only thing that catches drift with no
  # commit behind it — a browser patch in the pinned image, or a baseline that
  # was always marginal.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# Separate from `quality.yml` on purpose: this job is minutes where that one is
# seconds, and it is advisory for now. Keeping it out of that workflow means a
# slow or noisy visual run never delays the checks people actually gate on.
concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

# The scoped job commits baselines to the pull request branch, and the full
# sweep opens a recovery pull request and a tracking issue.
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # A job's `container:` is resolved before any of its steps run, so the image
  # cannot be computed inside the job that uses it. This one exists only to
  # print it. It deliberately does not install anything — visual-container.mjs
  # falls back to reading the pinned version out of pnpm-lock.yaml, so the tag
  # is still derived rather than written down here, and cannot drift from the
  # Playwright that produced the baselines.
  image:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - id: resolve
        run: echo "ref=$(node scripts/visual-container.mjs --print-image)" >> "$GITHUB_OUTPUT"

  # Only the shots the change could have altered. See
  # docs/superpowers/specs/2026-08-19-scoped-visual-ci-design.md for why this is
  # two layers, and why the sidebar fan-out overrides the narrowing.
  scoped:
    needs: image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ${{ needs.image.outputs.ref }}
      options: --shm-size=1g
    env:
      HUSKY: 0
      STORYBOOK_DISABLE_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v7
        with:
          # The scoper diffs against the merge base, and the commit steps push
          # back to the branch — neither works on a detached merge commit with
          # no history.
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
      - name: Set up pnpm via corepack
        run: |
          corepack enable
          corepack prepare --activate
          pnpm --version
      - name: Locate the pnpm store
        id: pnpm_store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      # The scoper and the missing-baseline detector both enumerate through
      # Playwright, which needs both builds to collect a single test. This has
      # to run before scope computation: visual-scope.mjs enumerates through
      # Playwright's --list, and its per-side guard throws if a changed
      # component maps to no shot — which happens whenever a newly added
      # component's stories aren't in the built Storybook yet. Don't reorder
      # this after the scope step.
      - name: Build Storybook and the docs site
        run: pnpm run pretest:visual

      - name: Identify the merge base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"
          echo "sha=$(git merge-base HEAD FETCH_HEAD)" >> "$GITHUB_OUTPUT"

      - name: Decide what to run
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          node scripts/visual-scope.mjs --base "${{ steps.base.outputs.sha }}" > /tmp/plan.json
          cat /tmp/plan.json

          # The grep goes to a file rather than a step output: it can be long
          # (the fan-out case names every route) and it contains characters
          # that a $GITHUB_OUTPUT round trip would mangle.
          node -pe 'JSON.parse(require("fs").readFileSync("/tmp/plan.json","utf8")).grep ?? ""' > /tmp/scope-grep.txt

          RUN=$(node -pe 'JSON.parse(require("fs").readFileSync("/tmp/plan.json","utf8")).run')
          REASON=$(node -pe 'JSON.parse(require("fs").readFileSync("/tmp/plan.json","utf8")).reason')
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

          printf '### Visual scope\n\n%s\n' "$REASON" >> "$GITHUB_STEP_SUMMARY"

      - name: Nothing to check
        if: steps.scope.outputs.run != 'true'
        run: cat /tmp/plan.json

      # Missing baselines are new work, not regressions. Minting them here is
      # what stops a component-adding pull request costing 14 minutes and a
      # manual dispatch. This can only ever CREATE a baseline — it cannot
      # overwrite one, which is what keeps it from laundering a regression.
      #
      # --update-snapshots=missing, NOT a bare --update-snapshots: Playwright's
      # bare flag defaults to "changed" mode, which overwrites any baseline
      # that differs from the current render. grepFor matches by test TITLE,
      # and titles are not unique across projects (wide vs. narrow share most
      # of theirs) — so a bare flag combined with this broad "any missing
      # shot" pattern could silently overwrite a sibling project's correct
      # baseline with a regression. With =missing, Playwright refuses to
      # overwrite anything, so the broad pattern is harmless by construction.
      - name: Mint baselines for new shots
        if: steps.scope.outputs.run == 'true'
        id: mint
        shell: bash
        env:
          DS_VISUAL_CONTAINER: '1'
        run: |
          set -euo pipefail
          MISSING=$(node scripts/visual-missing.mjs || true)
          if [ -z "$MISSING" ]; then
            echo "Every shot already has a baseline."
            echo "minted=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pnpm exec playwright test --update-snapshots=missing --workers=1 --grep "$MISSING"
          COUNT=$(git status --porcelain -- tests/visual/__screenshots__ | wc -l | tr -d ' ')
          echo "minted=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Commit the new baselines
        if: steps.mint.outputs.minted != '0' && steps.mint.outputs.minted != ''
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/visual/__screenshots__
          git commit -m "test(visual): ${{ steps.mint.outputs.minted }} new baselines" \
                     -m "Generated on the runner for shots that had none. Review the images in this diff."
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      # No DS_VISUAL_CONTAINER: the config pins updateSnapshots to 'none'
      # without it, so a baseline that is still missing at this point is a hard
      # failure rather than something quietly written.
      - name: Visual regression, scoped
        if: steps.scope.outputs.run == 'true'
        id: check
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec playwright test --workers=1 --grep "$(cat /tmp/scope-grep.txt)"

      # Overwriting an existing baseline is the operation the zero-tolerance
      # comparison exists to put a human in front of, so it is opt-in per pull
      # request and never automatic.
      #
      # --update-snapshots=changed, explicit: overwriting IS the intent of
      # this step, but the mode is spelled out so no reader has to know that a
      # bare --update-snapshots defaults to "changed" — see the mint step
      # above for why that default is dangerous when left implicit elsewhere.
      - name: Accept the changed baselines
        if: steps.check.outcome == 'failure' && contains(github.event.pull_request.labels.*.name, 'visual-accept')
        shell: bash
        env:
          DS_VISUAL_CONTAINER: '1'
        run: |
          set -euo pipefail
          FAILED=$(node scripts/visual-failures.mjs test-results/report.json)
          if [ -z "$FAILED" ]; then
            echo "The check failed but no shot is listed as failing — this is not a baseline problem."
            exit 1
          fi
          pnpm exec playwright test --update-snapshots=changed --workers=1 --grep "$FAILED"
          COUNT=$(git status --porcelain -- tests/visual/__screenshots__ | wc -l | tr -d ' ')
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/visual/__screenshots__
          git commit -m "test(visual): accept ${COUNT} baselines" \
                     -m "Accepted via the visual-accept label on this pull request. Review the images in this diff."
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          echo "Accepted ${COUNT} baselines." >> "$GITHUB_STEP_SUMMARY"

      - name: Report the failing shots
        if: steps.check.outcome == 'failure' && !contains(github.event.pull_request.labels.*.name, 'visual-accept')
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Visual regression"
            echo
            echo "If these changes are intended, add the \`visual-accept\` label and re-run this job."
            echo
            echo '```'
            node scripts/visual-failures.mjs test-results/report.json | tr '|' '\n'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Upload report and diffs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-report-scoped
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  # The full sweep. Task 7 renames this job to `full` and adds recovery.
  visual:
    needs: image
    runs-on: ubuntu-latest
    # Not on pull_request — `scoped` above covers that. Without this, both
    # jobs would run on every pull request.
    if: github.event_name != 'pull_request'
    # Advisory. Issue #65 records the criterion for making this required: ten
    # consecutive PRs with no false failure. Flipping it is a checklist item
    # there, not a someday — delete this line when the criterion is met.
    continue-on-error: true
    # Well clear of a real run (496 tests serially, plus two app builds) and far
    # under the 6-hour default. A webServer that never comes up otherwise burns
    # six hours per PR to tell us nothing.
    timeout-minutes: 90
    container:
      image: ${{ needs.image.outputs.ref }}
      # Chromium exhausts Docker's default 64MB /dev/shm and crashes outright on
      # large pages, which the full-page docs captures certainly are.
      options: --shm-size=1g
    env:
      # This runner is amd64 and the image is amd64, so nothing is emulated
      # here. That is the point: the flake recorded in #65 has only ever been
      # observed on an emulated arm64 host, and this job is what settles
      # whether it exists on native hardware.
      HUSKY: 0
      STORYBOOK_DISABLE_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v7
      # The image ships its own Node, matched to the Playwright it carries.
      # Installing another one here would decouple the runtime from the
      # browsers, which is the one thing this container exists to keep together.
      - name: Set up pnpm via corepack
        run: |
          corepack enable
          corepack prepare --activate
          pnpm --version
      - name: Locate the pnpm store
        id: pnpm_store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      # The specs enumerate from these builds — stories from Storybook's
      # index.json, routes from Next's prerender manifest — so both have to
      # exist before Playwright collects a single test. Its own step, rather
      # than pnpm's implicit `pretest:visual`, for the same reason
      # visual-container.mjs splits them: the two phases fail for entirely
      # different reasons, and a 40-minute job is much easier to read when a
      # build break and a pixel diff are not in the same log section.
      - name: Build Storybook and the docs site
        run: pnpm run pretest:visual
      # Invoked through `pnpm exec`, not `pnpm test:visual`, so the flags reach
      # the binary verbatim — the same reason the container script does it this
      # way, and this keeps CI's invocation identical to the one that generated
      # the baselines.
      #
      # Serial, deliberately. Worker contention is the largest single lever on
      # this suite's flake — on the emulated host it moved a run from 18
      # failures to 1 — so the first CI runs measure the calmest case. Raise it
      # once native runs show real headroom.
      #
      # DS_VISUAL_CONTAINER is deliberately NOT set: without it the config pins
      # updateSnapshots to 'none', so a missing baseline fails here instead of
      # being written and silently accepted.
      - name: Visual regression
        run: pnpm exec playwright test --workers=1
      # Not `if: failure()`. This job exists first of all to answer whether the
      # flake in #65 survives off an emulated host, and a *passing* run is half
      # of that evidence — the HTML report carries the timings and the retry
      # counts that say how close to the edge a green run was.
      - name: Upload report and diffs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
