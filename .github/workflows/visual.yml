name: Visual

# The push, nightly and dispatch half of the visual suite. Pull requests run
# visual-pr.yml instead — see the top of that file for why the two halves are
# separate workflows rather than two paths through one.
on:
  push:
    branches:
      - main
  # 06:00 UTC daily. The sweep is the only thing that catches drift with no
  # commit behind it — a browser patch in the pinned image, or a baseline that
  # was always marginal.
  schedule:
    - cron: '0 6 * * *'
  # Re-run the check on demand: the only way to re-check a commit whose run was
  # cancelled, or to re-test after a flake, without pushing an unrelated commit.
  workflow_dispatch:

# Separate from `quality.yml` on purpose: this job is minutes where that one is
# seconds, and it is advisory for now. Keeping it out of that workflow means a
# slow or noisy visual run never delays the checks people actually gate on.
#
# cancel-in-progress, unlike visual-update.yml (which omits it): a newer
# commit on main supersedes a sweep of an older one.
concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. `recover` elevates to contents: write, pull-requests:
# write and issues: write for itself only — it asks for exactly what it uses,
# and nothing is granted here in advance.
permissions:
  contents: read

jobs:
  # A job's `container:` is resolved before any of its steps run, so the image
  # cannot be computed inside the job that uses it. This one exists only to
  # print it. It deliberately does not install anything — visual-container.mjs
  # falls back to reading the pinned version out of pnpm-lock.yaml, so the tag
  # is still derived rather than written down here, and cannot drift from the
  # Playwright that produced the baselines.
  #
  # What it prints is tag@sha256:… — the tag says which Playwright, the digest
  # is what actually gets pulled. MCR republishes a tag like `v1.62.1-noble` in
  # place when its base is rebuilt, and a suite premised on a pinned renderer
  # must not follow that silently. The digest lives in
  # scripts/visual-image.lock.json; if it no longer matches the derived tag this
  # step fails here, before any job has started a container on a ref nobody
  # pinned.
  image:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - id: resolve
        run: echo "ref=$(node scripts/visual-container.mjs --print-image)" >> "$GITHUB_OUTPUT"

  # Both apps, built once for the whole run, plus the matrix the sweep fans out
  # across.
  #
  # Every job below needs Storybook's index.json and the docs prerender
  # manifest before Playwright can collect a single test — the specs enumerate
  # from them. Building that in each job would spend ~27s of the critical path
  # and ~2.5 machine-minutes per run re-deriving byte-identical output, so it
  # happens here and travels as an artifact instead.
  #
  # In the container, like the jobs that consume it: the image ships the Node
  # matched to its Playwright, and a docs site built on a different Node is not
  # obviously the same bytes. Cheap to keep identical, expensive to debug if it
  # ever is not.
  build:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ${{ needs.image.outputs.ref }}
      options: --shm-size=1g
    outputs:
      matrix: ${{ steps.matrix.outputs.include }}
    env:
      HUSKY: 0
      STORYBOOK_DISABLE_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v7
      # The container's git refuses a working copy made by the runner user
      # while steps run as root ("dubious ownership"), and it is needed earlier
      # here than anywhere else: Nx shells out to git to hash the workspace for its
      # own cache, so the very first `nx` invocation fails on a working copy
      # git considers dubiously owned.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Set up pnpm via corepack
        run: |
          corepack enable
          corepack prepare --activate
          pnpm --version
      - name: Locate the pnpm store
        id: pnpm_store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile

      # The layer above the pnpm store, and until now the one nothing cached.
      # `.nx/cache` is gitignored and was never restored by any workflow, so
      # Nx recomputed both builds from cold on every run — a docs-only pull
      # request still rebuilt Storybook from scratch.
      #
      # Keyed per commit rather than on a stable prefix, deliberately: a cache
      # entry is write-once in GitHub Actions, so a stable key would freeze the
      # very first run's cache and never pick up anything built after it. The
      # `restore-keys` prefixes are what actually deliver the hit — the newest
      # entry matching the prefix — and Nx re-derives its own content hashes
      # from the restored cache, so a partial or stale hit degrades to a
      # rebuild rather than to wrong output.
      #
      # An actions/cache step is the smallest part of making this work. Two
      # other things had to be true, and each failed silently on its own — a
      # green run with a cache that did nothing:
      #
      #   1. Nx caching is opt-in per target, and nothing here had ever set
      #      `cache: true`, so `.nx/cache` was never WRITTEN. The step restored
      #      nothing, saved nothing and cost 0s while looking like a working
      #      cache. `nx.json` now sets it on the `build` targetDefault.
      #      Measured: `pretest:visual` 14.4s cold, 0.9s replayed.
      #   2. The artifacts alone are unusable without their metadata — see the
      #      note on `path:` below.
      #
      # Both were caught only by reading step durations on a real run. Neither
      # would ever have failed a check.
      #
      # Enabling it is only safe because every `build` target declares outputs
      # its command actually writes. Audited all seven before turning it on:
      # docs writes `.next` and storybook `storybook-static` (the latter fixed
      # in 7e1947a — before that it inherited `{projectRoot}/dist`, a path the
      # build never writes, so a cache hit would have skipped the build while
      # restoring nothing and left no storybook-static/index.json for the specs
      # to enumerate from); react, tokens and ai-patterns really do write
      # `dist`; eslint-config and create-elirobinson-design-system are `echo`
      # no-ops with nothing to restore. Verified by deleting every output with
      # the cache warm and rebuilding: all five restored, both manifests back,
      # and Playwright collected the identical suite off the restored tree.
      #
      # So a new project whose build writes somewhere its `outputs` does not
      # name is now a silently under-selected sweep rather than a slow one.
      # That is the standing cost of this line.
      #
      # Restored on every run, SAVED only by the nightly run. The save is a
      # ~70MB upload in this job's post step, and every sweep job `needs` this
      # one — measured at 101s on run 35190180037, the single largest wait on
      # main's critical path. A per-commit key saves a new entry on every push
      # for the benefit of whichever run comes next; the nightly entry is at
      # most a day behind, and Nx rebuilds only what changed since.
      - uses: actions/cache/restore@v6
        id: nx_cache
        with:
          # BOTH paths, and that is not belt-and-braces. `.nx/cache` holds the
          # task outputs; the metadata that says which task hash produced them
          # lives in the database under `.nx/workspace-data`. Restore the
          # artifacts without the metadata and Nx says "Unrecognized Cache
          # Artifacts — Nx can only restore artifacts it has metadata about",
          # then rebuilds everything: a 71MB download that buys nothing.
          # Measured directly (run 32305974350: primary-key hit, 71MB restored,
          # build still 25s), and confirmed both directions locally — cache
          # plus metadata replays 5/5 tasks, cache alone rebuilds 5/5.
          #
          # The daemon's own directory is excluded: it holds a socket and a
          # `server-process.json` naming a PID from another machine, which is
          # state about a running process rather than a build result. Nx
          # disables the daemon in CI anyway, so this only keeps stale
          # process state from travelling between runs.
          path: |
            .nx/cache
            .nx/workspace-data
            !.nx/workspace-data/d
          key: ${{ runner.os }}-nx-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-nx-

      - name: Build Storybook and the docs site
        run: pnpm run pretest:visual
      - name: Save the Nx cache
        if: github.event_name == 'schedule'
        uses: actions/cache/save@v6
        with:
          path: |
            .nx/cache
            .nx/workspace-data
            !.nx/workspace-data/d
          key: ${{ steps.nx_cache.outputs.cache-primary-key }}

      # After the build, because it enumerates through Playwright, which needs
      # both builds to collect a test. See scripts/visual-matrix.mjs for why
      # the matrix is derived from that enumeration rather than written down:
      # `docs-wide` is currently commented out in playwright.config.ts, and
      # uncommenting it is meant to be the only edit that gives it jobs.
      - name: Plan the sweep matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          INCLUDE=$(node scripts/visual-matrix.mjs)
          echo "include=$INCLUDE" >> "$GITHUB_OUTPUT"
          {
            echo "### Sweep matrix"
            echo
            echo '```json'
            echo "$INCLUDE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Tarred rather than uploaded as a directory tree: `.next` alone is
      # thousands of small files, and actions/upload-artifact pays per file.
      #
      # --exclude .next/cache: that is Next's own incremental BUILD cache, 79MB
      # of the 120MB and no part of what `next start` serves — dropping it
      # takes the artifact from 70MB to 9MB. Verified by serving the docs site
      # with the directory removed; every route still returns 200.
      #
      # apps/docs/public/brand is the third path, and it is easy to miss because
      # it is neither built into `.next` nor committed. `stage-brand.mjs` writes
      # it during `docs:build`, `next start` serves public/ off disk at request
      # time, and apps/docs/.gitignore ignores it — so a job that downloads this
      # tarball instead of building has no copy from any source. The pull request
      # job built in-job at the time and never noticed; the `sweep` jobs download, and every
      # /brand/* route rendered there is missing its artifacts.
      #
      # It went unseen until #144 re-enabled `docs-wide`, because no sweep job
      # had ever rendered one of those routes. The baselines on main are correct
      # (minted by the pull request job, which had the directory), so the symptom was never a
      # wrong baseline — it was the full sweep about to fail those shots against
      # right ones, permanently, with no change causing it and no change fixing
      # it. 416K across 55 files against a 9MB artifact; the size argument that
      # justifies the exclude above does not apply here.
      - name: Pack the build outputs
        run: tar -czf build-outputs.tar.gz --exclude='.next/cache' apps/storybook/storybook-static apps/docs/.next apps/docs/public/brand
      - uses: actions/upload-artifact@v7
        with:
          name: visual-build
          path: build-outputs.tar.gz
          retention-days: 1

  # The sweep, fanned out. One job per project — sharded where a project is
  # long enough to be the critical path — instead of 501 shots taken one at a
  # time in a single job.
  #
  # `--workers=1` is unchanged in every invocation below, and that is the point
  # this split has to survive. Worker contention is the largest single lever on
  # this suite's flake rate (18 failures to 1 on the emulated host, issue #65),
  # so a shard is a separate machine running its own serial browser — never a
  # second browser on the same one. Parallelism is bought across VMs, never
  # inside one.
  #
  # The matrix comes from `build` rather than being written here, so the set of
  # jobs is whatever Playwright actually collected. See scripts/visual-matrix.mjs.
  #
  # This job takes the verdict but not the judgement: it writes a blob report
  # and stops. Merging the reports, regenerating the failing shots and failing
  # the run all happen once, downstream, in `full` — five jobs each pushing
  # baselines or each opening a pull request would race each other.
  sweep:
    needs: [image, build]
    # The check name in a pull request or on a commit is now the cheapest
    # failure signal we have: "sweep (storybook-narrow)" says which half of the
    # suite broke before anyone opens an artifact.
    name: sweep (${{ matrix.job.name }})
    strategy:
      # fail-fast: false is load-bearing, not a default left in place. With it
      # on, the first red project cancels every sibling still running — which
      # would destroy exactly the failure isolation this split exists to buy,
      # and would leave `full` merging a partial set of blob reports and
      # regenerating baselines against shots that were never judged.
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.build.outputs.matrix) }}
    runs-on: ubuntu-latest
    # Was 90 for the whole 501-shot serial suite; the largest job here is ~170
    # shots. Still generous: a webServer that never comes up otherwise burns
    # the timeout to tell us nothing.
    timeout-minutes: 45
    container:
      image: ${{ needs.image.outputs.ref }}
      # Chromium exhausts Docker's default 64MB /dev/shm and crashes outright on
      # large pages, which the full-page docs captures certainly are.
      options: --shm-size=1g
    env:
      # This runner is amd64 and the image is amd64, so nothing is emulated
      # here. That is the point: the flake recorded in #65 has only ever been
      # observed on an emulated arm64 host, and this job is what settles
      # whether it exists on native hardware.
      HUSKY: 0
      STORYBOOK_DISABLE_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v7
        with:
          # The exact commit `build` built, so the baselines on disk and the
          # rendered pages come from the same tree.
          ref: ${{ github.sha }}
      # Same reason as `build`'s copy: this job runs in the container against
      # a working copy made by the runner user, which is git's "dubious
      # ownership" case for anything that shells out to git.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # The image ships its own Node, matched to the Playwright it carries.
      # Installing another one here would decouple the runtime from the
      # browsers, which is the one thing this container exists to keep together.
      - name: Set up pnpm via corepack
        run: |
          corepack enable
          corepack prepare --activate
          pnpm --version
      - name: Locate the pnpm store
        id: pnpm_store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      # The specs enumerate from these builds — stories from Storybook's
      # index.json, routes from Next's prerender manifest — so both have to
      # exist before Playwright collects a single test. `build` made them once
      # for the whole run; every job here downloads that instead of spending
      # 27s of its own critical path rebuilding them.
      #
      # Both, even though a storybook-* job needs no `.next` and a docs-* job
      # needs no `storybook-static`: playwright.config.ts declares both servers
      # in one global `webServer` array and starts both regardless of the
      # selected project. Making that array conditional would let each job skip
      # half of this and one server boot — real, but small next to the build
      # itself, and the most invasive change to the config. Deferred on purpose.
      - name: Fetch the build outputs
        uses: actions/download-artifact@v7
        with:
          name: visual-build
      - name: Unpack the build outputs
        run: tar -xzf build-outputs.tar.gz

      # A missing served-off-disk asset does not fail a screenshot — it renders
      # as a stable empty box, and a stable empty box compares equal to itself
      # forever. So the guard cannot be a shot; it has to be this, before
      # Playwright starts, where the failure can still name its own cause.
      #
      # apps/docs/public/brand is checked by name because it is the one that was
      # actually missing (#149) and the one nothing else would report: it is
      # gitignored, so the checkout does not supply it, and it lives outside
      # `.next`, so unpacking a valid tarball proves nothing about it.
      - name: Check the build outputs are complete
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for path in \
            apps/storybook/storybook-static/index.json \
            apps/docs/.next/prerender-manifest.json \
            apps/docs/public/brand
          do
            if [ ! -e "$path" ]; then
              echo "::error::$path is missing from the build tarball. The specs enumerate from the first two, and /brand/* routes are served off disk from the third — a sweep without it renders those routes empty and fails them against baselines that are correct."
              missing=1
            fi
          done
          exit "$missing"

      # Invoked through `pnpm exec`, not `pnpm test:visual`, so the flags reach
      # the binary verbatim — the same reason the container script does it this
      # way, and this keeps CI's invocation identical to the one that generated
      # the baselines.
      #
      # DS_VISUAL_CONTAINER is deliberately NOT set: without it the config pins
      # updateSnapshots to 'none', so a missing baseline fails here instead of
      # being written and silently accepted.
      #
      # --reporter=blob overrides the config's list/html/json trio. Blob is the
      # only report format that merges losslessly across jobs, and `full`
      # rebuilds the html and json ones from these — including the -expected,
      # -actual and -diff PNGs, which travel inside the zip.
      #
      # No continue-on-error, unlike the single-job sweep this replaces: a red
      # job here SHOULD be red, immediately and by name. `full` reads
      # `needs.sweep.result` rather than a step outcome, and the upload below
      # carries `!cancelled()` so the evidence survives the failure.
      - name: Visual regression
        shell: bash
        env:
          PROJECTS: ${{ matrix.job.projects }}
          SHARD_INDEX: ${{ matrix.job.shardIndex }}
          SHARD_TOTAL: ${{ matrix.job.shardTotal }}
          # Playwright would otherwise name this after a hash of the command
          # line. Naming it after the job makes the merged artifact readable,
          # and — more importantly — guarantees two jobs can never write the
          # same filename into the merge directory, where the second would
          # silently replace the first and its shots would vanish from the
          # verdict. scripts/visual-matrix.mjs asserts the slugs are distinct.
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.job.slug }}.zip
        run: |
          set -euo pipefail
          # Routed through the environment and expanded into an array rather
          # than interpolated into the command text, the same discipline the
          # visual-pr.yml uses for branch names.
          ARGS=(--workers=1 --reporter=blob)
          for project in $PROJECTS; do
            ARGS+=("--project=$project")
          done
          # Only when there is something to shard. `--shard=1/1` is a no-op but
          # it also changes the blob report's default name, and an unsharded
          # job saying "1/1" in its log reads as if something were split.
          if [ "$SHARD_TOTAL" != "1" ]; then
            ARGS+=("--shard=${SHARD_INDEX}/${SHARD_TOTAL}")
          fi
          echo "playwright test ${ARGS[*]}"
          pnpm exec playwright test "${ARGS[@]}"

      # Per-job artifact name: five jobs uploading `visual-blob` would collide.
      # `full` collects them all back with a `visual-blob-*` pattern.
      #
      # !cancelled(), not `if: failure()`: a passing run is half the evidence
      # this suite exists to produce — the merged report carries the timings
      # and retry counts that say how close to the edge a green run was.
      - name: Upload the blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-blob-${{ matrix.job.slug }}
          path: blob-report/
          retention-days: 14
          if-no-files-found: error

  # The verdict, and the mechanical half of recovery. Everything that must
  # happen exactly once for the whole sweep lives here: merge the shards'
  # reports into one, regenerate exactly the failing shots, publish the
  # artifacts, and fail the run.
  #
  # Still named `full`, deliberately. release.yml gates publishing on the
  # conclusion of the JOB called `full` in this workflow — "every expected job
  # succeeded and all of them are present", with absent meaning stop. A matrix
  # renames its jobs (`sweep (storybook-wide)`), which no fixed selector can
  # match, so the gate needs a single job whose success means the whole sweep
  # succeeded. That is exactly what this job is: it needs every `sweep` job,
  # and GitHub gives `needs.sweep.result` the value 'success' only when every
  # leg of the matrix succeeded — and 'skipped' when the matrix was empty or
  # never ran, which fails the check below rather than passing it silently.
  #
  # Telling a red sweep's two causes apart — an intended change nobody
  # regenerated, or a real regression — is a visual judgement, so this job does
  # only the mechanical half and hands the result to `recover`, which opens the
  # pull request and the tracking issue that put the judgement in front of a
  # human. See `recover` below for why that is a separate job.
  full:
    needs: [image, build, sweep]
    # !cancelled() rather than the implicit success(): this job has to run
    # precisely when `sweep` went red, which is its whole recovery purpose. The
    # explicit result checks in its final step are what decide the verdict.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Regeneration reruns only the failing shots, but "the failing shots" can be
    # the whole suite after a token change.
    timeout-minutes: 90
    container:
      image: ${{ needs.image.outputs.ref }}
      options: --shm-size=1g
    env:
      HUSKY: 0
      STORYBOOK_DISABLE_TELEMETRY: 1
      # Read in several steps below; `needs` is not available inside a `run:`
      # block without being routed through the environment first.
      BUILD_RESULT: ${{ needs.build.result }}
      SWEEP_RESULT: ${{ needs.sweep.result }}
    steps:
      - uses: actions/checkout@v7
      # Same reason as `build`'s "Trust the checkout" step: this job also
      # runs in the container, and its regen step below asks git what changed
      # on disk (`git status --porcelain`) to tell a real baseline change from
      # #65's flake. Without this, git refuses the working copy as dubiously
      # owned and that check fails under `set -euo pipefail`. (`recover` needs
      # no equivalent — it runs on a bare runner; see the note there.)
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Set up pnpm via corepack
        run: |
          corepack enable
          corepack prepare --activate
          pnpm --version
      - name: Locate the pnpm store
        id: pnpm_store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile

      # Only the regeneration below needs these — merging blob reports touches
      # neither app — so the download is guarded on exactly the condition that
      # step carries, plus `build` having actually produced them. Worth keeping
      # off the green path: this job is the last thing between a green sweep
      # and a finished run, so every second it spends is wall clock a human is
      # waiting on.
      #
      # Guarded rather than assumed, unlike the sweep jobs, which cannot run at
      # all without the build: this job DOES run when `build` failed (that is
      # what `!cancelled()` is for), and has to reach its "no report at all"
      # path and its verdict rather than dying on a missing artifact.
      - name: Fetch the build outputs
        if: >-
          needs.build.result == 'success' && needs.sweep.result == 'failure' &&
          github.ref == 'refs/heads/main'
        uses: actions/download-artifact@v7
        with:
          name: visual-build
      - name: Unpack the build outputs
        if: >-
          needs.build.result == 'success' && needs.sweep.result == 'failure' &&
          github.ref == 'refs/heads/main'
        run: tar -xzf build-outputs.tar.gz

      # continue-on-error for the same reason the download in `recover` has
      # it: this job runs on paths where the sweep never produced anything —
      # `build` failed, or the matrix never started — and a hard-failing
      # download would replace the explanation below with an unhelpful red.
      - name: Fetch every shard's blob report
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: visual-blob-*
          merge-multiple: true
          path: all-blob-reports

      # The single report the rest of this workflow is written against.
      # `visual-failures.mjs`, the regen step below and `recover`'s issue body
      # all read one `test-results/report.json`, and a matrix produces N. Blob
      # is the format that merges losslessly, and merging rebuilds the html
      # report too — including the -expected/-actual/-diff PNGs, which travel
      # inside the zips rather than as loose files in test-results/output.
      #
      # PLAYWRIGHT_JSON_OUTPUT_FILE rather than a shell redirect: the json
      # reporter writes to stdout when it has no output file, and the html
      # reporter prints to stdout too, so redirecting would interleave a
      # human-readable line into the JSON and make it unparseable.
      #
      # `|| true` on an expected exit code: merge-reports exits 1 when the
      # merged result is 'failed' (see playwright/lib/cli/reportActions.js), so
      # a red sweep would otherwise kill this step under `set -euo pipefail`
      # before the report it just wrote could be used. Nothing is laundered —
      # the verdict comes from `needs.sweep.result` in the final step, never
      # from this exit code, and the file's own absence is handled below.
      - name: Merge the shards into one report
        id: merge
        shell: bash
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/report.json
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          set -euo pipefail
          if [ -z "$(ls -A all-blob-reports 2>/dev/null)" ]; then
            echo "No shard produced a blob report."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ls -l all-blob-reports
          # The same protection the single-job sweep's "Discard any stale
          # report" step gave: everything downstream picks the shots to
          # rewrite out of test-results/report.json, and that file must be the
          # one THIS merge wrote. A fresh container makes a leftover unlikely
          # rather than impossible, and the failure it would cause — baselines
          # overwritten against a report no sweep in this run produced — is
          # the one this workflow spends the most effort refusing.
          rm -rf test-results playwright-report
          mkdir -p test-results
          pnpm exec playwright merge-reports --reporter=json,html all-blob-reports || true
          if [ ! -f test-results/report.json ]; then
            echo "::error::merge-reports produced no report.json from $(ls all-blob-reports | wc -l) blob report(s)."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "merged=true" >> "$GITHUB_OUTPUT"

      # Which project failed, said in the one place a human looks first. With
      # the suite split, this is information the old single job could not
      # produce at all, and it is the cheapest signal the run has: a docs-wide
      # failure is almost always the sidebar fan-out, a storybook-* failure is
      # almost always a component.
      - name: Report which projects failed
        if: needs.sweep.result != 'success'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Visual sweep red"
            echo
            echo "| project | failing shots |"
            echo "| ------- | ------------- |"
          } >> "$GITHUB_STEP_SUMMARY"
          # From the merged report rather than from the matrix's job results: a
          # job can go red without any shot failing (a crash, a timeout, a
          # webServer that never came up), and the two read differently to
          # whoever is triaging. Both empty cases below say which one it was.
          if [ ! -f test-results/report.json ]; then
            echo "| _no merged report_ | the sweep never reached its reporter |" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          BY_PROJECT=$(node scripts/visual-failures.mjs --by-project test-results/report.json)
          if [ -z "$BY_PROJECT" ]; then
            echo "| _no failing shot in the merged report_ | a crash or a build break, not a baseline |" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Tab-separated out of the script, rendered as a table here: the
          # script stays a script and the Markdown stays in the workflow.
          echo "$BY_PROJECT" | while IFS=$'\t' read -r project shots; do
            echo "| \`${project}\` | ${shots} |"
          done >> "$GITHUB_STEP_SUMMARY"

      # The regen step below re-invokes Playwright, which rewrites
      # test-results/report.json, wipes its outputDir and clears
      # playwright-report/. The upload step runs after it, so without this the
      # `visual-report` artifact would hold a post-regen, all-green report and
      # no diff images at all — while `recover` writes into the tracking issue
      # "see the `visual-report` artifact on that run for images". Copy the
      # evidence aside first; the upload below includes it.
      #
      # Guarded exactly like the regen step it protects against: nothing
      # destroys the evidence on any other path.
      - name: Preserve the failing report before regenerating
        if: needs.sweep.result == 'failure' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pre-regen-report
          cp -r test-results pre-regen-report/test-results 2>/dev/null || true
          cp -r playwright-report pre-regen-report/playwright-report 2>/dev/null || true

          # The copies above are `|| true` on purpose — a failed preserve
          # should not block the regen step that follows. But `recover`'s
          # pull request and tracking issue both assert the diff images live
          # in `pre-regen-report/`, so a copy that silently failed would make
          # both of those wrong. Say so loudly instead of staying quiet.
          if [ -d test-results ] && [ ! -d pre-regen-report/test-results ]; then
            echo "::warning::Preserving test-results before regeneration failed — pre-regen-report/test-results is missing, so the recovery pull request and tracking issue will point at diff images that are not there."
          fi
          if [ -d playwright-report ] && [ ! -d pre-regen-report/playwright-report ]; then
            echo "::warning::Preserving playwright-report before regeneration failed — pre-regen-report/playwright-report is missing, so the recovery pull request and tracking issue will point at a report that is not there."
          fi

      # A red sweep on main means either an intended change nobody
      # regenerated or a real regression, and telling them apart is a visual
      # judgement — so this step does only the mechanical half: regenerate
      # exactly the failing shots so `recover` can put them in front of a
      # human as a pull request.
      #
      # In this job rather than in each `sweep` job, and that is not just
      # tidiness: five jobs each regenerating and each uploading baselines
      # would produce five partial baseline sets for `recover` to reconcile,
      # and (on visual-pr.yml's equivalent) five concurrent pushes to one
      # branch, rejecting each other. One report, one regeneration, one commit.
      #
      # No --project or --shard here: the merged report's failing titles select
      # the work, and a title that failed in two projects should be
      # regenerated in both.
      #
      # github.ref == 'refs/heads/main' as well as the sweep having failed:
      # `recover` below only ever opens a pull request against `main`, and
      # only runs at all on that ref (see the "Auto-recovery is main-only"
      # step below for the other case) — regenerating baselines nobody will
      # use is wasted container time.
      #
      # --update-snapshots=changed, explicit, never a bare --update-snapshots:
      # bare defaults to "changed" in this Playwright version (see
      # node_modules/.../playwright/lib/program.js, preset: "changed"), but
      # spelling it out means no reader has to know that.
      #
      # No `|| true` here, unlike visual-pr.yml's mint step. That step
      # needs `|| true` because --update-snapshots=missing WRITES the
      # baseline and then FAILS the test on purpose (a softError specific to
      # "missing" mode — see the comment there). --update-snapshots=changed
      # does not do that: it returns a plain pass for a shot it rewrote, so
      # this command is expected to exit 0 on its own. Tolerating a non-zero
      # exit here would hide a real crash instead of an expected soft-fail.
      - name: Regenerate the failing baselines
        if: needs.sweep.result == 'failure' && github.ref == 'refs/heads/main'
        id: regen
        shell: bash
        env:
          DS_VISUAL_CONTAINER: '1'
        run: |
          set -euo pipefail
          # No merged report means no shard ever reached its reporter — a
          # crash, a build break, or a matrix that never started. That is the
          # case this step already handles below, so it takes the same exit,
          # not an ENOENT trace.
          if [ ! -f test-results/report.json ]; then
            echo "The sweep produced no report.json at all — a crash or a build break, not a baseline. Nothing to regenerate."
            echo "recovered=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FAILED=$(node scripts/visual-failures.mjs test-results/report.json)
          if [ -z "$FAILED" ]; then
            echo "The sweep failed with no failing shot listed — a crash or a build break, not a baseline. Nothing to regenerate."
            echo "recovered=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Plain titles, one per line: this is what ships in the artifact for
          # `recover` to read back, and what the tracking issue lists. Kept
          # separate from $FAILED (the --grep pattern below), which is
          # regex-escaped and not meant for a human to read.
          node scripts/visual-failures.mjs --plain test-results/report.json > failing-shots.txt

          pnpm exec playwright test --update-snapshots=changed --workers=1 --grep "$FAILED"

          # A rerun that changes nothing on disk is the signature of issue
          # #65's flake, not a baseline to regenerate: --update-snapshots=changed
          # only rewrites a file when the rerun's pixels actually differ from
          # what's checked in, so no diff here means the original failure did
          # not reproduce.
          #
          # `git status --porcelain`, NOT `git diff --quiet`: this step does
          # not only rewrite existing baselines. A missing baseline (a new
          # story or route added on `main`, which isn't branch-protected) is
          # exactly the kind of failure this step regenerates, and
          # --update-snapshots=changed WRITES a missing baseline and passes
          # for it (expect.js's softError is specific to "missing" mode, same
          # fact visual-pr.yml's mint step documents) — producing a brand
          # new, UNTRACKED file. `git diff` only ever looks at tracked files,
          # so an all-new-baseline regeneration would show no diff at all and
          # get mislabelled a flake here. `git status --porcelain` sees both
          # tracked changes and untracked new files, same idiom visual-pr.yml's
          # job's mint and accept steps already use for this exact reason.
          if [ -z "$(git status --porcelain -- tests/visual/__screenshots__)" ]; then
            echo "recovered=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Visual sweep red — did not reproduce on regeneration"
              echo
              echo "The failing shot(s) below passed when rerun to regenerate baselines — the signature of the flake in #65, not a baseline change. This job stays red so that is still visible; no baseline pull request or tracking issue was opened."
              echo
              echo "See \`docs/agents/visual-regression.md\`, step 2 (\"run the identical commit twice\") for the diagnostic."
              echo
              echo '````'
              cat failing-shots.txt
              echo '````'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "recovered=true" >> "$GITHUB_OUTPUT"

      # The counterpart to the ref guard on the regen step above: `recover`
      # only runs on `main`, so a `workflow_dispatch` red sweep on a feature
      # branch would otherwise fail silently with no explanation of why no
      # pull request follows.
      - name: Auto-recovery is main-only
        if: needs.sweep.result == 'failure' && github.ref != 'refs/heads/main'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          {
            echo "### Visual sweep red — auto-recovery skipped"
            echo
            echo "This run was on \`${REF_NAME}\`, not \`main\`, so automatic baseline recovery (which opens a pull request against \`main\`) only runs there. To regenerate baselines for this branch by hand:"
            echo
            echo '```'
            echo "gh workflow run visual-update.yml --ref ${REF_NAME} --field grep=<pattern>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Kept as its own artifact, separate from the report below: this is the
      # one `recover` downloads, and it needs to exist even if the report
      # upload were ever pruned or renamed independently.
      - name: Upload the regenerated baselines
        if: steps.regen.outputs.recovered == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines-regen
          path: |
            tests/visual/__screenshots__
            failing-shots.txt
          retention-days: 14

      # Not `if: failure()`. This job exists first of all to answer whether the
      # flake in #65 survives off an emulated host, and a *passing* run is half
      # of that evidence — the HTML report carries the timings and the retry
      # counts that say how close to the edge a green run was.
      #
      # `all-blob-reports/` is deliberately NOT included, even though it is the
      # per-shard record a `merge-reports` rerun would need: each `sweep` job
      # already uploads its own zip as `visual-blob-<slug>` with the same
      # retention, and `merge-reports` unpacks the zips in place, so adding the
      # directory here would ship each shard's report twice — once zipped, once
      # extracted — inside an artifact whose point is the merged view.
      - name: Upload report and diffs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-report
          path: |
            playwright-report/
            test-results/
            pre-regen-report/
          retention-days: 14
          if-no-files-found: ignore

      # "Every expected job succeeded" and "every expected job ran" are
      # different claims, and only the second is safe to publish on. Job
      # results cannot make the second one: a leg whose blob report failed to
      # upload, or failed to download into the merge above, leaves every other
      # leg green and the merged report short — a run that looks entirely clean
      # while a whole project was never compared. So it is checked against the
      # merged report, project by project, against the matrix that planned it.
      #
      # !cancelled(): this has to run on a green sweep, which is exactly the
      # case it protects. It is skipped only when there is no merged report to
      # check, which the verdict step below owns instead.
      - name: Every project in the matrix reported
        if: ${{ !cancelled() && steps.merge.outputs.merged == 'true' }}
        shell: bash
        env:
          MATRIX: ${{ needs.build.outputs.matrix }}
        run: |
          set -euo pipefail
          printf '%s' "$MATRIX" > /tmp/matrix.json
          if MISSING=$(node scripts/visual-matrix.mjs --verify /tmp/matrix.json test-results/report.json); then
            echo "Every project the matrix planned is present in the merged report."
            exit 0
          fi
          {
            echo "### Visual sweep — a project never reported"
            echo
            echo "The matrix planned these projects, and the merged report has no trace of them. Their shots were not compared, so this run cannot be read as a pass."
            echo
            echo '```'
            echo "$MISSING"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Projects planned but never reported: $(echo "$MISSING" | tr '\n' ' ')"
          exit 1

      # The verdict, and the thing release.yml reads. Every upstream job has to
      # have succeeded AND be present — `needs.<job>.result` is 'skipped' for a
      # job that never ran, which fails here rather than passing silently, and
      # for a matrix `needs.sweep.result` is 'success' only when every leg
      # succeeded. That is the "absent means stop" property the release gate
      # depends on, preserved across the split.
      #
      # !cancelled(), so this still renders its verdict when the presence check
      # above failed — the two report different facts and a reader triaging a
      # red run wants both.
      #
      # This is also what `recover`'s `needs.full.result == 'failure'` guard
      # below reacts to, on `main`.
      - name: Fail the job
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$BUILD_RESULT" != "success" ]; then
            echo "::error::The build job concluded '${BUILD_RESULT}'. Nothing was swept."
            exit 1
          fi
          if [ "$SWEEP_RESULT" != "success" ]; then
            echo "::error::The sweep concluded '${SWEEP_RESULT}'. See the individual sweep jobs for which project failed."
            exit 1
          fi
          echo "Every sweep job passed."

  # `full` runs inside the Playwright container image, which ships git
  # (2.43.0) but not the `gh` CLI — nothing else in this repo shells out to
  # `gh` from inside a container; release.yml is the other user of `gh` and
  # it runs on a bare ubuntu-latest where the runner image preinstalls it.
  # Rather than teach the container about `gh`, the pull request and the
  # issue are opened from a second, container-less job instead.
  #
  # This split has a side benefit worth calling out: the regenerated
  # baselines and the failing-shot list survive in `full`'s artifact even if
  # this job's own PR/issue step fails.
  recover:
    needs: full
    # !cancelled(), not the bare `failure()` this started as: `failure()` on
    # a job checks its ENTIRE dependency chain, not just its direct `needs` —
    # so if `image` fails, `full` gets skipped (its own condition implicitly
    # requires `image` to have succeeded), but `failure()` still sees `image`
    # failing and would fire `recover` anyway, including on a pull request,
    # where this job holds contents/pull-requests/issues: write. Checking
    # `needs.full.result` directly is what makes this react only to `full`
    # itself actually failing (which only happens by the explicit "Fail the
    # job" step, i.e. only when the sweep was red) — but a plain `if:` that
    # doesn't call a status function gets `success()` prepended by GitHub,
    # which would always be false here since `full` failed; a status function
    # is what removes that implicit prefix so the explicit check below
    # governs. `!cancelled()`, not `always()`: `always()` would also fire
    # this job when a human cancels the run after `full` has already
    # concluded `failure` — `!cancelled()` excludes exactly that case while
    # still removing the implicit `success()` prefix.
    #
    # github.ref == 'refs/heads/main': the pull request this job opens is
    # always based on `main`, so it only runs there. A `workflow_dispatch`
    # red sweep on any other ref gets an explanation instead, from `full`'s
    # own "Auto-recovery is main-only" step — see there.
    if: >-
      !cancelled() && needs.full.result == 'failure' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    timeout-minutes: 15
    steps:
      # Same App token as visual-pr.yml's mint and accept, for the same reason and one more. The
      # branch this job force-pushes becomes the head of a recovery pull
      # request — so once `main` requires status checks, that branch needs
      # real check runs or the recovery it exists to offer cannot be merged.
      # GITHUB_TOKEN gives it none. The extra reason: a pull request OPENED
      # with GITHUB_TOKEN does not start `pull_request` workflows either, so
      # `gh pr create` below has to run as the App as well — hence the App
      # needs pull-requests:write and issues:write, not just contents:write.
      #
      # No credentials guard here, unlike visual-pr.yml. This job only runs when
      # the sweep on `main` has already gone red, so a missing secret surfaces
      # as a loud failure on an already-red path rather than as a silently
      # unmergeable pull request. visual-pr.yml is the one that needs guarding.
      - name: Mint a token for the baseline bot
        id: app_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.DS_BOT_APP_ID }}
          private-key: ${{ secrets.DS_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          # Two steps below push with this credential and call `gh`, which
          # also reads it for auth.
          persist-credentials: true
          token: ${{ steps.app_token.outputs.token }}

      # continue-on-error: `full` fails this job (and so triggers this one)
      # even when the sweep crashed before producing a failing-shot list, in
      # which case `full` never uploaded this artifact at all. A hard-failing
      # download step here would turn that case into an unhelpful red run
      # with no explanation; the next step gives it one instead.
      - name: Download the regenerated baselines
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: visual-baselines-regen
          path: .

      - name: Check whether there is anything to recover
        id: shots
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f failing-shots.txt ]; then
            echo "recovered=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "recovered=true" >> "$GITHUB_OUTPUT"

      - name: Nothing to recover
        if: steps.shots.outputs.recovered != 'true'
        run: |
          {
            echo "### Visual sweep red — no recovery opened"
            echo
            echo "\`full\` didn't leave anything here to act on. Two different causes land in this same place: a failure with no failing-shot list at all (an npm install failure, a Storybook or docs build failure, the container never starting, the job timing out — none of them a baseline problem), or a failing shot that passed clean when \`full\` reran it to regenerate — the flake in #65's signature, which \`full\`'s own job summary calls out specifically. Either way, check the \`full\` job's own log, and its job summary, for which one this was."
          } >> "$GITHUB_STEP_SUMMARY"

      # Everything below is idempotent on purpose: a nightly schedule can
      # fire again on a main that hasn't moved (same SHA, so the same branch
      # name), and a still-open regression can carry across many nightly
      # runs on a main that keeps moving (different SHAs, so different
      # branch names, but the same tracking issue). Neither case should mint
      # duplicates.
      - name: Open the baselines pull request and the tracking issue
        if: steps.shots.outputs.recovered == 'true'
        shell: bash
        env:
          # The App token, not GITHUB_TOKEN: a pull request opened with
          # GITHUB_TOKEN does not start `pull_request` workflows, so the
          # recovery pull request would carry no checks and, under branch
          # protection, could never be merged — defeating the entire purpose
          # of this job.
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail
          # No `safe.directory` config here, unlike the container jobs above:
          # this job runs on a bare runner, where the checkout is already
          # owned by the user running these steps.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          SHORT=$(git rev-parse --short HEAD)
          BRANCH="visual/baselines-${SHORT}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # `visual-baseline`, a dedicated label, NOT the general `visual`
          # label the tracking issue used to carry: `visual` is also the most
          # natural label a human would put on issue #65 itself (the
          # visual-regression flake issue this whole workflow references) —
          # if anyone ever did that, this lookup would find #65 forever and
          # never open a real tracking issue again. A label used nowhere else
          # in this repo can't collide with anything.
          #
          # Looked up before anything is created, so the pull request body
          # below can name a tracking issue that genuinely already exists,
          # rather than a promise that might not hold if a later step fails.
          EXISTING_ISSUE_URL=$(gh issue list --label visual-baseline --state open --limit 1 --json url --jq '.[0].url // empty')

          git checkout -b "$BRANCH"
          git add tests/visual/__screenshots__
          # Real file count, not the de-duplicated-by-title count
          # failedTitles() (and so scripts/visual-failures.mjs) produces: one
          # title failing in two projects is one title but two PNGs, and this
          # is what the commit, the pull request title, and the issue body
          # should all actually say landed. Same shape as visual-pr.yml's
          # own minted-baseline count.
          COUNT=$(git status --porcelain -- tests/visual/__screenshots__ | wc -l | tr -d ' ')
          git commit -m "test(visual): regenerate ${COUNT} baseline file(s) from ${SHORT}"
          # Fetched first, deliberately: --force-with-lease's safety check
          # compares against the LOCAL remote-tracking ref, and this checkout
          # never fetched this specific branch (only the default branch, via
          # actions/checkout above). With no local tracking ref to lease
          # against, git assumes the branch is expected not to exist yet and
          # REFUSES the push the moment it actually does — the exact
          # same-SHA re-run case this is meant to handle. `|| true`: the
          # first time this SHA is ever seen, the branch genuinely doesn't
          # exist upstream, and that fetch failing is expected, not an error.
          git fetch origin "$BRANCH" || true
          # --force-with-lease, not a plain push: a nightly re-run on a main
          # that hasn't moved resolves to this exact branch name again, and a
          # plain push is rejected non-fast-forward against yesterday's
          # commit there — which, under `set -euo pipefail`, kills this step
          # before the issue or the pull request is even looked up. The
          # branch only ever holds one thing, this SHA's regenerated
          # baselines, so overwriting it with today's regeneration (even if
          # byte-identical) is correct, not destructive.
          git push --force-with-lease origin "$BRANCH"

          # Same branch name means the earlier run's pull request, if this is
          # a same-SHA re-run, is still open against it — reuse it instead of
          # asking `gh pr create` to fail on a head that already has one.
          EXISTING_PR_URL=$(gh pr list --head "$BRANCH" --base main --state open --limit 1 --json url --jq '.[0].url // empty')

          # No tracking-issue line here, even when EXISTING_ISSUE_URL is
          # already known: this body only matters if it's used for a fresh
          # `gh pr create` below, and either way the pull request gets its
          # authoritative body — including the issue link — from the
          # unconditional `gh pr edit` after the issue is settled. Keeping
          # one body-writing block downstream of that, instead of two,
          # is what stops the first-red case from silently omitting the
          # link the way it used to.
          {
            printf '%s\n\n' "The full sweep went red on \`main\` at \`${SHORT}\` and these ${COUNT} baseline file(s) were regenerated on the runner."
            printf '%s\n' '**Merge** if this is the look you intended — these become the baselines.'
            printf '%s\n\n' '**Close** if it is a regression; the tracking issue stays open with the evidence.'
            printf -- '- Failing run: %s\n' "$RUN_URL"
            printf -- '- Failing report and diff images: %s#artifacts (the `visual-report` artifact, `pre-regen-report/`)\n' "$RUN_URL"
          } > /tmp/pr-body.md

          if [ -n "$EXISTING_PR_URL" ]; then
            PR_URL="$EXISTING_PR_URL"
            echo "Re-pushed the regenerated baselines from ${RUN_URL} (still \`${SHORT}\`)." > /tmp/pr-comment.md
            gh pr comment "$PR_URL" --body-file /tmp/pr-comment.md
          else
            PR_URL=$(gh pr create \
              --head "$BRANCH" \
              --base main \
              --title "visual: ${COUNT} baseline file(s) changed on main" \
              --body-file /tmp/pr-body.md)
          fi

          # The pull request above always exists for real by this point —
          # whether just-created or reused — so the issue body below can say
          # a pull request is open rather than one that might still fail to
          # open after this text is written.
          if [ -n "$EXISTING_ISSUE_URL" ]; then
            ISSUE_URL="$EXISTING_ISSUE_URL"
            {
              printf '%s\n\n' "Red again at \`${SHORT}\` (run: ${RUN_URL})."
              printf -- '- Regenerated baselines: %s\n' "$PR_URL"
            } > /tmp/issue-comment.md
            gh issue comment "$ISSUE_URL" --body-file /tmp/issue-comment.md
          else
            {
              printf '%s\n\n' "The full sweep failed on \`main\` at \`${SHORT}\`."
              printf -- '- Failing run: %s\n' "$RUN_URL"
              printf -- '- Failing shots: %s file(s) (see \`pre-regen-report/\` in the \`visual-report\` artifact on that run for the -actual and -diff images)\n\n' "$COUNT"
              printf '%s\n\n' "A pull request with the regenerated baselines is open — merging it accepts these as the intended look, closing it says this is a real regression."
              printf -- '- Regenerated baselines: %s\n\n' "$PR_URL"
              printf '%s\n\n' '<details><summary>Failing shots</summary>'
              # A quadruple-backtick fence, not a triple: a failing spec
              # title is free text and could itself contain a triple-backtick
              # run, which would close a triple-backtick fence early. Nothing
              # in Markdown lets a title close a longer fence by accident.
              printf '````\n'
              cat failing-shots.txt
              printf '````\n'
              printf '%s\n' '</details>'
            } > /tmp/issue-body.md
            ISSUE_URL=$(gh issue create \
              --title "Visual sweep red on main (${SHORT})" \
              --label visual-baseline \
              --body-file /tmp/issue-body.md)
          fi
          # A GitHub issue URL's trailing path segment is its number — true
          # for both a freshly created issue and one found via the API, so
          # this works uniformly for either branch above without a separate
          # --json number lookup.
          ISSUE_NUMBER="${ISSUE_URL##*/}"

          # Unconditional, run whether the pull request was just created or
          # reused: on a first red sweep it had no issue to link at creation
          # time (EXISTING_ISSUE_URL was empty), so this is what actually
          # attaches the link — in both directions, since the issue side
          # already names the pull request above. `Closes #<N>`, not a bare
          # URL: a closing keyword is what makes merging this pull request
          # close its tracking issue automatically, which is what keeps the
          # EXISTING_ISSUE_URL lookup above self-terminating instead of
          # wedging open on one old issue forever.
          {
            printf '%s\n\n' "The full sweep went red on \`main\` at \`${SHORT}\` and these ${COUNT} baseline file(s) were regenerated on the runner."
            printf '%s\n' '**Merge** if this is the look you intended — these become the baselines.'
            printf '%s\n\n' '**Close** if it is a regression; the tracking issue stays open with the evidence.'
            printf -- '- Tracking issue: %s\n' "$ISSUE_URL"
            printf -- '- Failing run: %s\n' "$RUN_URL"
            # The report artifact, which the design calls for alongside the
            # run and the issue: the run page links the artifact but does not
            # show what is in it, and `pre-regen-report/` inside it is the
            # only place the -actual/-diff images for these baselines survive
            # (the regen that produced this branch overwrote the live ones).
            # Reviewing this pull request means looking at those images, so
            # the body has to say where they are.
            printf -- '- Failing report and diff images: %s#artifacts (the `visual-report` artifact, `pre-regen-report/`)\n\n' "$RUN_URL"
            printf 'Closes #%s\n' "$ISSUE_NUMBER"
          } > /tmp/pr-body-final.md
          gh pr edit "$PR_URL" --body-file /tmp/pr-body-final.md

          {
            echo "### Visual sweep red — recovery opened"
            echo
            echo "- Pull request: ${PR_URL}"
            echo "- Issue: ${ISSUE_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
