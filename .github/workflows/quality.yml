name: Quality

on:
  pull_request:
  push:
    branches:
      - main

# Superseded pushes to the same PR/branch are cancelled; `release.yml` uses a
# separate, non-cancelling group so publishes are never interrupted.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          # Uses `packageManager` from ./package.json so CI stays in sync.
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      # No NODE_AUTH_TOKEN needed: every `@elirobinson/*` dependency resolves to
      # a `link:` workspace entry in the lockfile, so this never hits the
      # GitHub Packages registry.
      - run: pnpm install --frozen-lockfile
      # Build before typecheck: apps/docs consumes @elirobinson/react and
      # @elirobinson/tokens through their package exports maps (./dist/*),
      # not source aliases, so on a clean checkout its type-only imports
      # don't resolve until the packages it depends on are built.
      - run: pnpm build
      # `pnpm build` regenerates apps/docs/src/generated/component-manifest.json
      # from packages/react/src. That committed file is what the ai-patterns
      # pack step reads to produce the llms snapshot it ships — it never builds
      # apps/docs. So a stale commit of it would silently ship a snapshot
      # describing components that no longer look like that.
      - name: Fail if the committed component manifest is stale
        run: |
          if ! git diff --exit-code -- apps/docs/src/generated/component-manifest.json; then
            echo "::error::component-manifest.json is out of date. Run 'pnpm build' and commit the result."
            exit 1
          fi
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - name: Require a changeset for package changes
        if: github.event_name == 'pull_request'
        run: pnpm changeset status --since=origin/${{ github.event.pull_request.base.ref }}
