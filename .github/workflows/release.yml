name: Release

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: design-system-release
  cancel-in-progress: false

jobs:
  release:
    # Only runs after Quality has passed on main (or a manual dispatch), so a
    # broken build or failing tests can never reach the registry.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@elirobinson'
      # See quality.yml for why this is corepack rather than pnpm/action-setup.
      # Keep the two workflows' setup in step: this one publishes, so a
      # difference in how it resolves pnpm is a difference in what ships.
      - name: Set up pnpm via corepack
        run: |
          corepack enable
          corepack prepare --activate
          pnpm --version
      - name: Locate the pnpm store
        id: pnpm_store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - run: pnpm changeset:version
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "chore(release): version packages"
            git push origin HEAD:main
          else
            echo "No pending changesets; nothing to version."
          fi
      - run: pnpm build
      - name: Capture existing tags
        id: pre_tags
        run: echo "tags=$(git tag -l | sort | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      - name: Publish to GitHub Packages
        run: bash ./scripts/changeset-publish.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Push new tags and create GitHub releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          before="${{ steps.pre_tags.outputs.tags }}"
          for tag in $(git tag -l); do
            if [[ " $before " != *" $tag "* ]]; then
              git push origin "refs/tags/$tag"
              gh release create "$tag" --generate-notes
            fi
          done
