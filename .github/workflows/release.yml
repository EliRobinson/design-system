name: Release

on:
  # Triggered by Visual, not Quality, because Visual is the SLOWER of the two
  # (~9m against ~2m) and publishing must wait for both. A `workflow_run`
  # trigger listing several workflows fires when ANY of them completes, not
  # when all do — `workflows: [Quality, Visual]` would publish on Quality's
  # completion exactly as this file did before. So: trigger on the slow one,
  # and assert the fast one separately in the first step below.
  workflow_run:
    workflows: [Visual]
    types: [completed]
    branches: [main]
  # The escape hatch, and the reason gating on the sweep is reversible: if a
  # flaky sweep blocks a publish, dispatch this workflow by hand.
  workflow_dispatch:

concurrency:
  group: design-system-release
  cancel-in-progress: false

jobs:
  release:
    # `event == 'push'` keeps the nightly sweep from firing this workflow.
    # Visual also runs on a 06:00 UTC schedule, and a scheduled run's head_sha
    # is whatever main points at — very often `chore(release): version
    # packages`, this workflow's own bot commit (7 of 20 at time of writing).
    # Re-running Release against a commit that was already released does no
    # useful work: `changeset:version` finds no changesets, so nothing is
    # versioned, published, or tagged. The filter skips the run rather than
    # paying for it.
    #
    # HISTORICAL NOTE, because the original reason has expired. This filter
    # was introduced when the version-bump push went out with GITHUB_TOKEN,
    # whose pushes do not trigger workflows — so those commits had NO runs at
    # all (measured zero for afdb4f4, fc6827c, 988985c) and the Quality lookup
    # below would have found nothing and failed the guard: a red Release every
    # night. The push now goes out as the release App, whose pushes DO trigger
    # workflows, so those commits now carry a Quality run and that failure
    # mode is gone. The filter stays because avoiding a pointless run is still
    # worth it — but it is no longer load-bearing, and removing it would waste
    # time rather than break anything.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write
      # Reading another workflow's run and job conclusions in the guard step
      # below. Without it that step 403s on the first real run.
      actions: read
    steps:
      # First step on purpose: it needs no checkout and no toolchain, so a
      # commit that should not publish fails here in seconds rather than after
      # a full install and build.
      - name: Require the full sweep and Quality to have passed for this commit
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          # The JOB's conclusion, not the run's. `full` carries
          # `if: github.event_name != 'pull_request'`, so it is skipped rather
          # than failed whenever that condition stops holding — and a run whose
          # only visual job was skipped still concludes `success`. Gating on
          # the run conclusion alone would therefore treat "the sweep never
          # ran" as "the sweep passed", which is the exact silent
          # under-selection this gate exists to prevent.
          FULL=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" \
            --jq '[.jobs[] | select(.name == "full")] | first | .conclusion // empty')
          if [ "$FULL" != "success" ]; then
            echo "::error::The full visual sweep did not pass for $SHA (conclusion: ${FULL:-absent}). Not publishing."
            exit 1
          fi

          # Visual and Quality are separate workflows on the same commit, so
          # Quality has to be looked up by SHA rather than read off this event.
          QUALITY=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA&status=completed" \
            --jq '[.workflow_runs[] | select(.name == "Quality")] | first | .conclusion // empty')
          if [ "$QUALITY" != "success" ]; then
            echo "::error::Quality did not pass for $SHA (conclusion: ${QUALITY:-absent}). Not publishing."
            exit 1
          fi

          echo "full and Quality both passed for $SHA; proceeding to publish."
      # The version-bump push below must NOT go out as `github-actions`.
      #
      # Once `main` requires status checks, that push needs a ruleset bypass —
      # and a bypass granted to the generic `github-actions` identity is a
      # bypass granted to EVERY workflow in this repository, because that is
      # the identity each one gets automatically from GITHUB_TOKEN.
      #
      # A dedicated App narrows it to one named actor. Critically, this is a
      # DIFFERENT App from the baseline bot (DS_BOT_*): that token is minted in
      # visual.yml's `scoped` job, which persists it into the workspace and
      # then builds Storybook and the docs site FROM THE PULL REQUEST'S OWN
      # SOURCE. Pull-request-authored code therefore runs with the baseline
      # bot's credential present. That is acceptable when the worst case is a
      # stray baseline commit; it would be fatal if that same identity could
      # also bypass main's protection, because any pull request could then
      # exfiltrate the token and push straight to main — defeating the exact
      # gate this is all meant to impose, silently and green.
      #
      # This App's token is only ever minted here, in a job that runs
      # post-merge on main and never executes pull-request-authored code.
      - name: Require the release bot's credentials
        shell: bash
        env:
          APP_ID: ${{ secrets.DS_RELEASE_APP_ID }}
          PRIVATE_KEY: ${{ secrets.DS_RELEASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          MISSING=""
          [ -n "${APP_ID:-}" ]      || MISSING="$MISSING DS_RELEASE_APP_ID"
          [ -n "${PRIVATE_KEY:-}" ] || MISSING="$MISSING DS_RELEASE_PRIVATE_KEY"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing repository secret(s):$MISSING — the release bot cannot push the version bump, and this job must not fall back to GITHUB_TOKEN (that identity's ruleset bypass would have to cover every workflow in the repo)."
            echo "Fix: create/install a release-only GitHub App with contents:write, then:"
            echo "  gh secret set DS_RELEASE_APP_ID --body '<app id>'"
            echo "  gh secret set DS_RELEASE_PRIVATE_KEY < <app>.private-key.pem"
            exit 1
          fi

      - name: Mint a token for the release bot
        id: release_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.DS_RELEASE_APP_ID }}
          private-key: ${{ secrets.DS_RELEASE_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          # Persisted for the version-bump push and the tag pushes below, so
          # both go out as the release App rather than as github-actions.
          token: ${{ steps.release_token.outputs.token }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@elirobinson'
      # See quality.yml for why this is corepack rather than pnpm/action-setup.
      # Keep the two workflows' setup in step: this one publishes, so a
      # difference in how it resolves pnpm is a difference in what ships.
      - name: Set up pnpm via corepack
        run: |
          corepack enable
          corepack prepare --activate
          pnpm --version
      - name: Locate the pnpm store
        id: pnpm_store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - run: pnpm changeset:version
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "chore(release): version packages"
            git push origin HEAD:main
          else
            echo "No pending changesets; nothing to version."
          fi
      - run: pnpm build
      - name: Capture existing tags
        id: pre_tags
        run: echo "tags=$(git tag -l | sort | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      - name: Publish to GitHub Packages
        run: bash ./scripts/changeset-publish.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Push new tags and create GitHub releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          before="${{ steps.pre_tags.outputs.tags }}"
          for tag in $(git tag -l); do
            if [[ " $before " != *" $tag "* ]]; then
              git push origin "refs/tags/$tag"
              gh release create "$tag" --generate-notes
            fi
          done
