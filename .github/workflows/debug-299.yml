name: debug-299
on:
  push:
    branches: ['claude/299-adoption-screenshot-80a664']
    paths: ['.github/workflows/debug-299.yml']
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - id: resolve
        run: echo "ref=$(node scripts/visual-container.mjs --print-image)" >> "$GITHUB_OUTPUT"
  stress:
    needs: image
    strategy:
      fail-fast: false
      matrix:
        leg: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ${{ needs.image.outputs.ref }}
      options: --shm-size=1g
    env:
      HUSKY: 0
      STORYBOOK_DISABLE_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: |
          corepack enable
          corepack prepare --activate
          pnpm install --frozen-lockfile
          pnpm exec nx run-many -t build --projects=storybook,docs
      - name: Cold-process loop
        shell: bash
        run: |
          fails=0; shotfails=0
          for i in $(seq 1 40); do
            out=$(pnpm exec playwright test --workers=1 --project=docs-wide --reporter=line --grep '(/|/adoption) · (light|dark)$' 2>&1 || true)
            if echo "$out" | grep -q "Unable to capture screenshot"; then
              fails=$((fails+1)); echo "ITER $i: CAPTURE CRASH"; echo "$out" | grep -B2 -A12 "Unable to capture" | head -30
            fi
            if echo "$out" | grep -q "toHaveScreenshot"; then shotfails=$((shotfails+1)); fi
            echo "iter $i ran: $(echo "$out" | grep -E 'passed|failed' | tr '\n' ' ')"
          done
          echo "RESULT crashes=$fails pixelfails=$shotfails of 40"
