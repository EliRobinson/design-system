name: Visual update

# Regenerates baselines on the runner and commits them back.
#
# The point is that the machine writing a baseline is the machine that checks
# it. Generating on a developer's Mac means an amd64 container emulated on
# arm64, and issue #65 measured the consequence: a handful of pages render
# differently enough that their baselines fail CI on every run, byte-identical
# regeneration or not. No amount of local iteration fixes those — the host is
# the variable. Here there is no host to differ from.
#
# It also removes the ~30-minute local container cycle from the loop entirely.
#
# Manual only. This workflow writes to the repository, so it never fires on a
# push or a schedule; a person triggers it, on a branch, deliberately.
on:
  workflow_dispatch:
    inputs:
      grep:
        description: 'Only regenerate tests matching this pattern (Playwright --grep). Leave blank for all.'
        required: false
        type: string

# Not cancel-in-progress: a half-finished baseline update that gets cancelled
# leaves the branch with some baselines rewritten and some not, which is worse
# than waiting.
concurrency:
  group: visual-update-${{ github.ref }}

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - id: resolve
        run: echo "ref=$(node scripts/visual-container.mjs --print-image)" >> "$GITHUB_OUTPUT"

  update:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ${{ needs.image.outputs.ref }}
      options: --shm-size=1g
    env:
      HUSKY: 0
      STORYBOOK_DISABLE_TELEMETRY: 1
      # The guard in playwright.config.ts refuses --update-snapshots without
      # this. It exists so a laptop cannot bake host font rendering into a
      # baseline; here it is set deliberately, in the one place where writing
      # baselines is the entire point.
      DS_VISUAL_CONTAINER: 1
    steps:
      # This REVERSES a deliberate choice, so the reasoning matters. The
      # comment that stood here wanted the default token precisely because
      # its pushes do not trigger workflows — "the commit this makes should
      # not immediately re-run the visual check against baselines nobody has
      # looked at yet."
      #
      # That intent does not survive branch protection. This workflow is the
      # documented fallback for fork pull requests (see the fork guard in
      # visual.yml), and it pushes to whatever branch it was dispatched on.
      # Once `main` requires status checks, a commit pushed here with
      # GITHUB_TOKEN carries none, and the pull request it lands on becomes
      # permanently unmergeable — the fallback would hand maintainers a dead
      # end.
      #
      # The original worry is also weaker than it looks: re-running the check
      # approves nothing. It compares the regenerated baselines against
      # themselves, which either passes or exposes a genuinely unstable shot.
      # A human still reviews the images in the diff before merging, which is
      # where the actual judgement lives.
      - name: Mint a token for the baseline bot
        id: app_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.DS_BOT_APP_ID }}
          private-key: ${{ secrets.DS_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          token: ${{ steps.app_token.outputs.token }}
      - name: Set up pnpm via corepack
        run: |
          corepack enable
          corepack prepare --activate
          pnpm --version
      - name: Locate the pnpm store
        id: pnpm_store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - name: Build Storybook and the docs site
        run: pnpm run pretest:visual
      # Serial, matching visual.yml. A baseline written under contention is the
      # one thing this workflow must not produce.
      - name: Regenerate baselines
        # The pattern goes through the environment rather than being
        # interpolated into the command. A `${{ }}` substitution here would be
        # dispatch input pasted straight into a shell, in a job holding
        # contents: write — the classic script-injection shape.
        env:
          GREP: ${{ inputs.grep }}
        # Explicit bash: a container job's default shell is `sh -e {0}`, and
        # `set -o pipefail` is not a valid option there. The image ships bash.
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$GREP" ]; then
            pnpm exec playwright test --update-snapshots --workers=1 --grep "$GREP"
          else
            pnpm exec playwright test --update-snapshots --workers=1
          fi
      - name: Commit the regenerated baselines
        # Explicit bash: a container job's default shell is `sh -e {0}`, and
        # `set -o pipefail` is not a valid option there. The image ships bash.
        shell: bash
        run: |
          set -euo pipefail
          # The container's git refuses a repo it does not own; the checkout is
          # made by the runner user, not root.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git diff --quiet -- tests/visual/__screenshots__; then
            echo "No baseline changed. Nothing to commit."
            exit 0
          fi

          git add tests/visual/__screenshots__
          COUNT=$(git diff --cached --name-only | wc -l | tr -d ' ')
          git commit -m "test(visual): regenerate ${COUNT} baselines on the runner" \
                     -m "Generated by the Visual update workflow from ${GITHUB_SHA}, on the same runner class that verifies them. Refs #65"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "Committed ${COUNT} baselines."
