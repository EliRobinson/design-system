<!doctype html>
<html><head><meta charset="utf-8"><title>Miltinson · Docs / Coaching guide</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head><body>
<div id="app"></div>
<script type="text/babel" src="../_shared/Primitives.jsx"></script>
<script type="text/babel">
const TOC = ({ active }) => {
  const items = ['Introduction', 'Warm-up drills', 'Session structure', 'Game-day frameworks', 'Common mistakes', 'Printable templates'];
  return (
    <nav style={{ position: 'sticky', top: 24, padding: '24px 16px' }}>
      <div style={{ fontFamily: 'JetBrains Mono, monospace', fontSize: 11, letterSpacing: '0.16em', textTransform: 'uppercase', color: 'var(--fg-3)', marginBottom: 12 }}>On this page</div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 4, borderLeft: '1px solid var(--border)' }}>
        {items.map((it, i) => (
          <a key={it} href="#" style={{
            padding: '6px 12px',
            fontFamily: 'Geist, sans-serif', fontSize: 13,
            color: i === active ? 'var(--ink-1000)' : 'var(--fg-2)',
            fontWeight: i === active ? 500 : 400,
            textDecoration: 'none',
            borderLeft: i === active ? '1px solid var(--ink-1000)' : '1px solid transparent',
            marginLeft: -1
          }}>{it}</a>
        ))}
      </div>
    </nav>
  );
};

const Article = () => (
  <article style={{ maxWidth: 720, padding: '48px 32px', fontFamily: 'Geist, sans-serif' }}>
    <Eyebrow>Coaching Guide · Vol. 01</Eyebrow>
    <h1 style={{
      fontFamily: 'Geist, sans-serif', fontWeight: 600, fontSize: 56,
      letterSpacing: '-0.025em', lineHeight: 1.05, margin: '16px 0 24px'
    }}>Session plans for U10s.</h1>
    <p style={{ fontSize: 20, lineHeight: 1.55, color: 'var(--fg-2)', margin: '0 0 32px' }}>
      A practical, no-fluff playbook for first-time coaches. 12 sessions,
      printable templates, and the frameworks I actually use on the pitch.
    </p>
    <div style={{ display: 'flex', gap: 16, padding: '16px 0', borderTop: '1px solid var(--border)', borderBottom: '1px solid var(--border)', alignItems: 'center', marginBottom: 40, fontFamily: 'JetBrains Mono, monospace', fontSize: 12, color: 'var(--fg-3)', letterSpacing: '0.04em' }}>
      <span>By Eli Robinson</span>
      <span>·</span>
      <span>14 min read</span>
      <span>·</span>
      <span>Updated 26 Apr 2026</span>
    </div>
    <h2 style={{ fontFamily: 'Geist, sans-serif', fontWeight: 600, fontSize: 28, letterSpacing: '-0.02em', margin: '40px 0 12px' }}>Why structure matters</h2>
    <p style={{ fontSize: 16, lineHeight: 1.7, color: 'var(--fg)', margin: '0 0 16px' }}>
      Most beginner coaches show up with a vague plan, run a few drills they
      remember from when they played, and hope it lands. It rarely does. Kids
      get bored, parents get frustrated, and you leave the pitch wondering
      what worked.
    </p>
    <p style={{ fontSize: 16, lineHeight: 1.7, color: 'var(--fg)', margin: '0 0 16px' }}>
      A session plan fixes that. Not a rigid script — a <em>scaffold</em> you
      can adapt on the fly when six players cancel or it's pouring rain.
    </p>
    <blockquote style={{
      margin: '32px 0', padding: '20px 28px',
      borderLeft: '3px solid var(--signal-500)',
      background: 'var(--bg-subtle)',
      fontFamily: 'Geist, sans-serif', fontSize: 19,
      fontStyle: 'normal', lineHeight: 1.5, letterSpacing: '-0.01em',
      color: 'var(--fg)'
    }}>"Plan the shape, not the steps. Kids will surprise you — your scaffold should let them."</blockquote>
    <h2 style={{ fontFamily: 'Geist, sans-serif', fontWeight: 600, fontSize: 28, letterSpacing: '-0.02em', margin: '40px 0 12px' }}>The 4-block session</h2>
    <ol style={{ fontSize: 16, lineHeight: 1.7, color: 'var(--fg)', paddingLeft: 22 }}>
      <li><strong>Warm-up</strong> (10 min) — movement + ball touches, no queuing.</li>
      <li><strong>Skill block</strong> (15 min) — one technique, three reps, low pressure.</li>
      <li><strong>Game block</strong> (20 min) — small-sided, modified rules to surface the skill.</li>
      <li><strong>Wind-down</strong> (5 min) — circle up, ask one question, send them home smiling.</li>
    </ol>
    <pre style={{
      background: 'var(--bg-muted)', border: '1px solid var(--border)',
      borderRadius: 6, padding: 16, fontSize: 13,
      fontFamily: 'JetBrains Mono, monospace', overflow: 'auto', margin: '24px 0'
    }}>{`# Session 03 — Passing under pressure
Warm-up   10 min   triangle passing, 1-touch
Skill     15 min   wall pass, both feet
Game      20 min   3v3 + 2 floaters, no offside
Wind-down  5 min   "what surprised you today?"`}</pre>
  </article>
);

const App = () => (
  <div style={{ maxWidth: 1100, margin: '0 auto', display: 'grid', gridTemplateColumns: '220px 1fr', gap: 0 }}>
    <TOC active={1} />
    <Article />
  </div>
);
ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
</body></html>
