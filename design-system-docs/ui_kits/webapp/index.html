<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Web app UI kit</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="app"></div>
<script src="../_shared/content.js"></script>
  <script type="text/babel" src="../_shared/Primitives.jsx"></script>
<script type="text/babel" src="./Components.jsx"></script>
<script type="text/babel">
const App = () => (
  <div style={{ display: 'flex', minHeight: '100vh' }}>
    <Sidebar active="Dashboard" />
    <main style={{ flex: 1, background: 'var(--bg)' }}>
      <TopBar title="Dashboard" />
      <div style={{ padding: 32 }}>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 16, marginBottom: 28 }}>
          <StatCard label="Revenue" value="$2,340" delta="$420" deltaPositive />
          <StatCard label="Active projects" value="5" delta="1" deltaPositive />
          <StatCard label="Clients" value="14" delta="2" deltaPositive />
          <StatCard label="Avg. response" value="6h" delta="2h" deltaPositive={false} />
        </div>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 16 }}>
          <h2 style={{ fontFamily: 'Geist, sans-serif', fontWeight: 600, fontSize: 22, letterSpacing: '-0.02em', margin: 0 }}>Projects</h2>
          <RuleLink>View all</RuleLink>
        </div>
        <ProjectsTable />
      </div>
    </main>
  </div>
);
ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
</body>
</html>
