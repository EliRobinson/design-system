<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg);font-family:var(--font-sans)}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}</style></head><body><div class="row"><div style="display:grid;gap:6px"><div style="width:56px;height:48px;border-radius:var(--radius-sm);background:var(--bg);border:1px solid var(--border)"></div><span class="lbl">bg</span></div><div style="display:grid;gap:6px"><div style="width:56px;height:48px;border-radius:var(--radius-sm);background:var(--bg-subtle);border:1px solid var(--border)"></div><span class="lbl">bg-subtle</span></div><div style="display:grid;gap:6px"><div style="width:56px;height:48px;border-radius:var(--radius-sm);background:var(--bg-muted);border:1px solid var(--border)"></div><span class="lbl">bg-muted</span></div><div style="display:grid;gap:6px"><div style="width:56px;height:48px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--border)"></div><span class="lbl">surface</span></div><div style="display:grid;gap:6px"><div style="width:56px;height:48px;border-radius:var(--radius-sm);background:var(--surface-2);border:1px solid var(--border)"></div><span class="lbl">surface-2</span></div><div style="display:grid;gap:6px"><div style="width:56px;height:48px;border-radius:var(--radius-sm);background:var(--surface-3);border:1px solid var(--border)"></div><span class="lbl">surface-3</span></div><div style="display:grid;gap:6px"><div style="width:56px;height:48px;border-radius:var(--radius-sm);background:var(--border);border:1px solid var(--border)"></div><span class="lbl">border</span></div><div style="display:grid;gap:6px"><div style="width:56px;height:48px;border-radius:var(--radius-sm);background:var(--border-strong);border:1px solid var(--border)"></div><span class="lbl">border-strong</span></div></div></body></html>
