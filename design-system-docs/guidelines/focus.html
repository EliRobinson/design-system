<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg);font-family:var(--font-sans)}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}</style></head><body><div class="row" style="gap:16px"><button class="ds-button ds-button--primary" style="outline:2px solid var(--focus-ring);outline-offset:2px">Focused</button><button class="ds-button ds-button--secondary">Default</button><button class="ds-button ds-button--primary" disabled>Disabled</button><span class="lbl">hover = one shade lighter · press = darker + translateY(1px)</span></div></body></html>
