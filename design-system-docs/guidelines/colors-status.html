<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg);font-family:var(--font-sans)}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}</style></head><body><div class="row"><div style="display:grid;gap:6px"><div style="width:56px;height:48px;border-radius:var(--radius-sm);background:var(--status-success)"></div><span class="lbl">status-success</span></div><div style="display:grid;gap:6px"><div style="width:56px;height:48px;border-radius:var(--radius-sm);background:var(--status-warning)"></div><span class="lbl">status-warning</span></div><div style="display:grid;gap:6px"><div style="width:56px;height:48px;border-radius:var(--radius-sm);background:var(--status-danger)"></div><span class="lbl">status-danger</span></div><div style="display:grid;gap:6px"><div style="width:56px;height:48px;border-radius:var(--radius-sm);background:var(--status-info)"></div><span class="lbl">status-info</span></div></div></body></html>
