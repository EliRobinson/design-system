<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg);font-family:var(--font-sans)}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}</style></head><body><div class="row"><div style="display:grid;gap:8px"><div style="width:100px;height:60px;background:var(--surface);border-radius:var(--radius-md);box-shadow:var(--shadow-xs)"></div><span class="lbl">xs</span></div><div style="display:grid;gap:8px"><div style="width:100px;height:60px;background:var(--surface);border-radius:var(--radius-md);box-shadow:var(--shadow-sm)"></div><span class="lbl">sm</span></div><div style="display:grid;gap:8px"><div style="width:100px;height:60px;background:var(--surface);border-radius:var(--radius-md);box-shadow:var(--shadow-md)"></div><span class="lbl">md</span></div><div style="display:grid;gap:8px"><div style="width:100px;height:60px;background:var(--surface);border-radius:var(--radius-md);box-shadow:var(--shadow-lg)"></div><span class="lbl">lg</span></div><div style="display:grid;gap:8px"><div style="width:100px;height:60px;background:var(--surface);border-radius:var(--radius-md);box-shadow:var(--shadow-xl)"></div><span class="lbl">xl</span></div><div style="display:grid;gap:8px"><div style="width:100px;height:60px;background:var(--surface);border-radius:var(--radius-md);box-shadow:var(--shadow-inset)"></div><span class="lbl">inset</span></div></div></body></html>
