<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg);font-family:var(--font-sans)}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}</style></head><body><div class="row"><div style="display:grid;gap:6px"><div style="width:88px;height:56px;background:var(--bg-subtle);border:1px solid var(--border-strong);border-radius:var(--radius-none)"></div><span class="lbl">none 0</span></div><div style="display:grid;gap:6px"><div style="width:88px;height:56px;background:var(--bg-subtle);border:1px solid var(--border-strong);border-radius:var(--radius-xs)"></div><span class="lbl">xs 2px</span></div><div style="display:grid;gap:6px"><div style="width:88px;height:56px;background:var(--bg-subtle);border:1px solid var(--border-strong);border-radius:var(--radius-sm)"></div><span class="lbl">sm 4px</span></div><div style="display:grid;gap:6px"><div style="width:88px;height:56px;background:var(--bg-subtle);border:1px solid var(--border-strong);border-radius:var(--radius-md)"></div><span class="lbl">md 6px</span></div><div style="display:grid;gap:6px"><div style="width:88px;height:56px;background:var(--bg-subtle);border:1px solid var(--border-strong);border-radius:var(--radius-lg)"></div><span class="lbl">lg 10px</span></div><div style="display:grid;gap:6px"><div style="width:88px;height:56px;background:var(--bg-subtle);border:1px solid var(--border-strong);border-radius:var(--radius-xl)"></div><span class="lbl">xl 16px</span></div><div style="display:grid;gap:6px"><div style="width:88px;height:56px;background:var(--bg-subtle);border:1px solid var(--border-strong);border-radius:var(--radius-pill)"></div><span class="lbl">pill 999px</span></div></div></body></html>
