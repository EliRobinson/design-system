<!doctype html>
<html><head><meta charset="utf-8"><title>Brand</title>
<link rel="stylesheet" href="_card.css">
<style>
  .brand { background: var(--ink-1000); color: var(--ink-0); padding: 36px 36px; min-height: 240px; display: flex; flex-direction: column; justify-content: space-between; gap: 28px; }
  .wm { font-family: var(--font-sans); font-weight: 600; font-size: 56px; letter-spacing: -0.025em; line-height: 1; }
  .wm .dot { color: var(--signal-500); }
  .tag { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: oklch(100% 0 0 / 0.55); }
  .rule { height: 1px; background: oklch(100% 0 0 / 0.18); }
  .meta { display: flex; justify-content: space-between; align-items: end; font-family: var(--font-mono); font-size: 11px; color: oklch(100% 0 0 / 0.55); letter-spacing: 0.04em; }
</style>
</head><body>
<div class="brand">
  <div class="tag">MILTINSON TECHNOLOGIES — EST. 2024</div>
  <div class="wm">Miltinson<span class="dot">.</span></div>
  <div class="rule"></div>
  <div class="meta">
    <span>BUILDER · CONSULTANT · FOUNDER</span>
    <span>miltinsons.com</span>
  </div>
</div>
</body></html>
