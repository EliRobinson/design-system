<!doctype html>
<html><head><meta charset="utf-8"><title>Radii & Shadows</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 20px 24px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .swarm { display: flex; gap: 14px; align-items: end; flex-wrap: wrap; }
  .item { display: flex; flex-direction: column; gap: 6px; align-items: center; font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
  .box { width: 56px; height: 56px; background: var(--surface); border: 1px solid var(--border); }
  .sbox { width: 56px; height: 56px; background: var(--surface); border-radius: 6px; }
</style>
</head><body>
<div class="card">
  <div class="row2">
    <div>
      <div class="eyebrow" style="margin-bottom:12px">Radii</div>
      <div class="swarm">
        <div class="item"><div class="box" style="border-radius:0"></div>none</div>
        <div class="item"><div class="box" style="border-radius:2px"></div>xs · 2</div>
        <div class="item"><div class="box" style="border-radius:4px"></div>sm · 4</div>
        <div class="item"><div class="box" style="border-radius:6px"></div>md · 6</div>
        <div class="item"><div class="box" style="border-radius:10px"></div>lg · 10</div>
        <div class="item"><div class="box" style="border-radius:16px"></div>xl · 16</div>
      </div>
    </div>
    <div>
      <div class="eyebrow" style="margin-bottom:12px">Shadow scale</div>
      <div class="swarm">
        <div class="item"><div class="sbox" style="box-shadow:var(--shadow-xs)"></div>xs</div>
        <div class="item"><div class="sbox" style="box-shadow:var(--shadow-sm)"></div>sm</div>
        <div class="item"><div class="sbox" style="box-shadow:var(--shadow-md)"></div>md</div>
        <div class="item"><div class="sbox" style="box-shadow:var(--shadow-lg)"></div>lg</div>
        <div class="item"><div class="sbox" style="box-shadow:var(--shadow-xl)"></div>xl</div>
      </div>
    </div>
  </div>
</div>
</body></html>
