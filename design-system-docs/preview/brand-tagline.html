<!doctype html>
<html><head><meta charset="utf-8"><title>Tagline</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 32px 36px; min-height: 200px; justify-content: space-between; }
  .primary { font-family: var(--font-sans); font-weight: 600; font-size: 44px; letter-spacing: -0.025em; line-height: 1.05; }
  .primary span { color: var(--signal-700); }
  .alt-list { display: flex; flex-direction: column; gap: 6px; padding-top: 16px; border-top: 1px solid var(--border); }
  .alt { display: flex; gap: 12px; align-items: baseline; font-family: var(--font-sans); }
  .alt .num { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); width: 16px; }
  .alt .text { font-size: 14px; color: var(--fg-2); }
</style>
</head><body>
<div class="card">
  <div>
    <div class="eyebrow">Primary tagline</div>
    <div class="primary" style="margin-top:10px">Builder. Consultant. <span>Founder.</span></div>
  </div>
  <div class="alt-list">
    <div class="eyebrow">Secondary lines</div>
    <div class="alt"><span class="num">01</span><span class="text">Practical tech, honestly built.</span></div>
    <div class="alt"><span class="num">02</span><span class="text">Built by hand. Shipped on purpose.</span></div>
    <div class="alt"><span class="num">03</span><span class="text">AI help without the hype.</span></div>
  </div>
</div>
</body></html>
