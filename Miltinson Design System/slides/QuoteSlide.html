<!doctype html>
<html><head><meta charset="utf-8"><title>Miltinson · Quote slide</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  .slide { width: 1280px; height: 720px; background: var(--bg); padding: 96px; display: flex; flex-direction: column; justify-content: center; }
  .mark { font-family: var(--font-sans); font-weight: 600; font-size: 220px; line-height: 0.7; color: var(--signal-500); margin-bottom: -40px; }
  .quote { font-family: var(--font-sans); font-weight: 500; font-size: 64px; letter-spacing: -0.025em; line-height: 1.1; margin: 0; max-width: 1000px; color: var(--fg); }
  .quote em { font-style: normal; background: linear-gradient(transparent 65%, var(--signal-300) 65%); }
  .attr { display: flex; align-items: center; gap: 16px; margin-top: 64px; }
  .avatar { width: 56px; height: 56px; border-radius: 999px; background: var(--ink-1000); color: var(--ink-0); display: grid; place-items: center; font-family: var(--font-sans); font-weight: 600; font-size: 18px; }
  .name { font-family: var(--font-sans); font-weight: 500; font-size: 18px; color: var(--fg); }
  .role { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-3); margin-top: 4px; }
</style></head><body>
<div class="slide">
  <div class="mark">"</div>
  <p class="quote">No jargon, no judgment — just <em>practical solutions</em> from someone who's actually shipped.</p>
  <div class="attr">
    <div class="avatar">SR</div>
    <div>
      <div class="name">Sarah R., small business owner</div>
      <div class="role">AI Consulting · 2026</div>
    </div>
  </div>
</div>
</body></html>
