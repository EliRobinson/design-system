<!doctype html>
<html><head><meta charset="utf-8"><title>Miltinson · Slides index</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 48px; background: var(--bg-subtle); }
  h1 { font-family: var(--font-sans); font-weight: 600; font-size: 32px; letter-spacing: -0.025em; margin: 0 0 8px; }
  p { font-family: var(--font-sans); color: var(--fg-2); margin: 0 0 32px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 1100px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .card iframe { width: 100%; height: 270px; border: 0; display: block; }
  .card .meta { padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; }
  .card .name { font-family: var(--font-sans); font-weight: 500; font-size: 14px; }
  .card .tag { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-3); }
  .frame-wrap { background: var(--ink-100); display: grid; place-items: center; height: 270px; overflow: hidden; }
  .frame-wrap iframe { transform: scale(0.375); transform-origin: top left; width: 1280px; height: 720px; border: 0; pointer-events: none; }
  .frame-wrap-inner { width: 480px; height: 270px; overflow: hidden; }
</style></head><body>
<h1>Miltinson · Slide deck templates</h1>
<p>Four 16:9 templates. Open each individually for full size.</p>

  <a class="card" href="ContentSlide.html"><div class="frame-wrap"><div class="frame-wrap-inner"><iframe src="ContentSlide.html"></iframe></div></div><div class="meta"><span class="name">3-up content</span><span class="tag">02 · CONTENT</span></div></a>
  <a class="card" href="QuoteSlide.html"><div class="frame-wrap"><div class="frame-wrap-inner"><iframe src="QuoteSlide.html"></iframe></div></div><div class="meta"><span class="name">Quote</span><span class="tag">03 · QUOTE</span></div></a>
  <a class="card" href="CloserSlide.html"><div class="frame-wrap"><div class="frame-wrap-inner"><iframe src="CloserSlide.html"></iframe></div></div><div class="meta"><span class="name">Closer</span><span class="tag">04 · CLOSER</span></div></a>
</div>
</body></html>
