<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing scale</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 20px 24px; }
  .grid { display: grid; grid-template-columns: 70px 1fr 90px; row-gap: 6px; column-gap: 12px; align-items: center; font-family: var(--font-mono); font-size: 11px; }
  .name { color: var(--fg); font-weight: 500; }
  .bar { background: var(--ink-1000); height: 10px; border-radius: 2px; }
  .px { color: var(--fg-3); text-align: right; }
</style>
</head><body>
<div class="card">
  <div class="eyebrow">Spacing · 4px base</div>
  <div class="grid">
    <div class="name">--space-1</div><div class="bar" style="width:4px"></div><div class="px">4px</div>
    <div class="name">--space-2</div><div class="bar" style="width:8px"></div><div class="px">8px</div>
    <div class="name">--space-3</div><div class="bar" style="width:12px"></div><div class="px">12px</div>
    <div class="name">--space-4</div><div class="bar" style="width:16px"></div><div class="px">16px</div>
    <div class="name">--space-5</div><div class="bar" style="width:20px"></div><div class="px">20px</div>
    <div class="name">--space-6</div><div class="bar" style="width:24px"></div><div class="px">24px</div>
    <div class="name">--space-7</div><div class="bar" style="width:32px"></div><div class="px">32px</div>
    <div class="name">--space-8</div><div class="bar" style="width:40px"></div><div class="px">40px</div>
    <div class="name">--space-9</div><div class="bar" style="width:48px"></div><div class="px">48px</div>
    <div class="name">--space-10</div><div class="bar" style="width:64px"></div><div class="px">64px</div>
    <div class="name">--space-11</div><div class="bar" style="width:80px"></div><div class="px">80px</div>
    <div class="name">--space-12</div><div class="bar" style="width:96px"></div><div class="px">96px</div>
    <div class="name">--space-13</div><div class="bar" style="width:128px"></div><div class="px">128px</div>
  </div>
</div>
</body></html>
