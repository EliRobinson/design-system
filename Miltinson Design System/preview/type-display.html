<!doctype html>
<html><head><meta charset="utf-8"><title>Type · Display</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 20px 28px; }
  .row { display: flex; flex-direction: column; gap: 14px; }
  .specimen { display: flex; align-items: baseline; gap: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  .specimen:last-child { border-bottom: 0; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); width: 90px; flex-shrink: 0; line-height: 1.4; }
  .text { color: var(--fg); letter-spacing: -0.025em; line-height: 1; font-family: var(--font-sans); font-weight: 600; }
</style>
</head><body>
<div class="card">
  <div class="eyebrow">Display · Geist 600</div>
  <div class="row">
    <div class="specimen"><div class="meta">Display 1<br>64 / 1.05</div><div class="text" style="font-size:64px">Builder.</div></div>
    <div class="specimen"><div class="meta">Display 2<br>48 / 1.05</div><div class="text" style="font-size:48px">Practical tech, honestly built.</div></div>
    <div class="specimen"><div class="meta">H1 · 38 / 1.1</div><div class="text" style="font-size:38px">Featured Apps</div></div>
  </div>
</div>
</body></html>
