<!doctype html>
<html><head><meta charset="utf-8"><title>Color · Signal</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 20px 24px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .scale { display: grid; grid-template-columns: repeat(9, 1fr); gap: 0; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .chip { aspect-ratio: 1/1.3; display: flex; flex-direction: column; justify-content: flex-end; padding: 5px; font-family: var(--font-mono); font-size: 9px; }
  .chip.light { color: var(--ink-1000); opacity: 0.85; }
  .chip.dark { color: var(--ink-0); opacity: 0.95; }
  .label-row { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); margin-top: 6px; }
</style>
</head><body>
<div class="card">
  <div class="row2">
    <div>
      <div class="eyebrow">Signal · Miltinson Amber</div>
      <div class="scale" style="margin-top:8px">
        <div class="chip light" style="background:var(--signal-50)">50</div>
        <div class="chip light" style="background:var(--signal-100)">100</div>
        <div class="chip light" style="background:var(--signal-200)">200</div>
        <div class="chip light" style="background:var(--signal-300)">300</div>
        <div class="chip light" style="background:var(--signal-400)">400</div>
        <div class="chip light" style="background:var(--signal-500)">500</div>
        <div class="chip light" style="background:var(--signal-600)">600</div>
        <div class="chip dark" style="background:var(--signal-700)">700</div>
        <div class="chip dark" style="background:var(--signal-800)">800</div>
      </div>
      <div class="label-row"><span>oklch 72.5% · 65°</span><span>500 = primary</span></div>
    </div>
    <div>
      <div class="eyebrow">Anchor · Miltinson Forest</div>
      <div class="scale" style="margin-top:8px">
        <div class="chip light" style="background:var(--anchor-50)">50</div>
        <div class="chip light" style="background:var(--anchor-100)">100</div>
        <div class="chip light" style="background:var(--anchor-200)">200</div>
        <div class="chip light" style="background:var(--anchor-300)">300</div>
        <div class="chip dark" style="background:var(--anchor-400)">400</div>
        <div class="chip dark" style="background:var(--anchor-500)">500</div>
        <div class="chip dark" style="background:var(--anchor-600)">600</div>
        <div class="chip dark" style="background:var(--anchor-700)">700</div>
        <div class="chip dark" style="background:var(--anchor-800)">800</div>
      </div>
      <div class="label-row"><span>oklch 42% · 156°</span><span>500 = primary</span></div>
    </div>
  </div>
</div>
</body></html>
