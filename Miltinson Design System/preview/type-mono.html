<!doctype html>
<html><head><meta charset="utf-8"><title>Type · Mono & Eyebrow</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 20px 28px; }
  .row { display: flex; flex-direction: column; gap: 14px; }
  .specimen { display: flex; align-items: baseline; gap: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  .specimen:last-child { border-bottom: 0; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); width: 90px; flex-shrink: 0; line-height: 1.4; }
  .mono { font-family: var(--font-mono); color: var(--fg); }
  .eb { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--fg-2); font-weight: 500; }
</style>
</head><body>
<div class="card">
  <div class="eyebrow">Mono · JetBrains Mono</div>
  <div class="row">
    <div class="specimen"><div class="meta">Eyebrow<br>12 · +0.16em</div><div class="eb">Featured · Education</div></div>
    <div class="specimen"><div class="meta">Pricing<br>20 / mono 500</div><div class="mono" style="font-size:20px;font-weight:500">From&nbsp;$150/hr</div></div>
    <div class="specimen"><div class="meta">Inline code<br>14</div><div class="mono" style="font-size:14px">npm&nbsp;install&nbsp;@miltinson/ui</div></div>
    <div class="specimen"><div class="meta">Meta<br>11</div><div class="mono" style="font-size:11px;color:var(--fg-3)">v1.0.0&nbsp;·&nbsp;updated&nbsp;26&nbsp;Apr&nbsp;2026</div></div>
  </div>
</div>
</body></html>
